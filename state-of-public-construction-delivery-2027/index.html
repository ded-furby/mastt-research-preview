 its population and its source. Where a number is our own calculation, we say so."}),l.jsx("p",{children:"Four bodies of records sit behind it. More than 10,000 completed Texas DOT construction contracts give the deepest view of time, cost and change inside one owner. More than 580,000 completed US federal construction contracts show how change behaves across agencies and contract types. About 31,800 Commonwealth contract notices give the Australian comparison. Sixty-four public project risk registers show what teams plan for."}),l.jsx(AE,{title:"Public construction delivery at a glance",stats:[{value:17,suffix:"%",label:"Texas DOT jobs charged exactly the days allowed",detail:"1,682 of 10,041 completed jobs, against 83 one day late",visual:{kind:"distribution",bins:zg.map(s=>s.value),max:21,marker:10.5}},{value:13,suffix:"%",label:"Of contract value moves under a 5% net change",detail:"Gross change on 5,265 completed Texas DOT jobs"},{value:47,suffix:"%",label:"Of jobs well behind at halfway ended with late penalties",detail:"Against 10% for jobs on track, from 436 jobs checked",visual:{kind:"trend",values:Bg.map(s=>s.rate)}},{value:14,suffix:"%",label:"Of public risk registers mention contractor insolvency",detail:"9 of 64 registers read by hand"}]}),l.jsx(EE,{items:[l.jsx(l.Fragment,{children:"17% of 10,041 completed Texas DOT construction jobs were charged exactly the days allowed. Only 1% were charged one day more, against 6% one day fewer."}),l.jsx(l.Fragment,{children:"A 5% net change in Texas DOT job cost hides 13% of contract value moving, because reductions on original items and additions of new item types pull in opposite directions."}),l.jsx(l.Fragment,{children:"13% of Texas DOT bid items, about 1 in 7, were never paid. Only 39% ended at the bid quantity."}),l.jsx(l.Fragment,{children:"Jobs more than 10 points behind at the halfway mark ended with late penalties 47% of the time, against 10% for jobs on track."}),l.jsx(l.Fragment,{children:"Late penalties are common but small. 22% of jobs paid them, and the typical penalty was $18,000, or 0.7% of contract value."}),l.jsx(l.Fragment,{children:"Bigger jobs change more. 79% of Texas DOT jobs over $20m received extra days, against 8% under $100k, and 78.5% of US federal contracts over $1m changed in value."}),l.jsx(l.Fragment,{children:"Only 9 of 64 public project risk registers, 14%, mention contractor insolvency."})]}),l.jsx(kE,{items:[{id:"deadline",label:"How often do Texas DOT jobs finish on the allowed day?"},{id:"halfway",label:"Does the halfway mark predict late penalties?"},{id:"change",label:"How much does the work change under the net figure?"},{id:"size",label:"Do bigger jobs change more?"},{id:"firms",label:"Who delivers the work?"},{id:"federal",label:"How often do US federal contracts change after signing?"},{id:"compare",label:"How do Australian and US contract changes compare?"},{id:"risk",label:"What do public risk registers plan for?"},{id:"faq",label:"FAQs"},{id:"sources",label:"Sources and methodology"}]}),l.jsx(cL,{tone:"info",title:"Texas figures describe Texas DOT work only",children:"Texas DOT builds roads and bridges under one set of specifications. Its results are a benchmark for that kind of work, not a measure of construction as a whole. The US federal and Australian figures cover many agencies and building types, and each country records change in a different way. Dollar figures for Texas DOT and US federal work are in US dollars. Commonwealth figures are in Australian dollars, and no figure is converted."}),l.jsx(ML,{title:"How each measure is defined",description:"Days allowed, late penalty, net change and gross change",children:l.jsxs("ul",{children:[l.jsx("li",{children:"Days allowed are the contract days in the bid plus any days added by change order. Days charged are the working days counted against the contract."}),l.jsx("li",{children:"A late penalty is liquidated damages charged for days over the allowed time. Every penalty equals days over multiplied by the daily rate."}),l.jsx("li",{children:"Net change is final cost against the awarded amount. Gross change adds every movement in either direction."}),l.jsx("li",{children:"For US federal and Commonwealth contracts, changed in value means at least one recorded modification or amendment that altered contract value."})]})}),l.jsxs(Za,{id:"deadline",title:"How often do Texas DOT jobs finish on the allowed day?",children:[l.jsxs("p",{children:["Texas DOT charges contractors working days against a contract time that is set in the contract and can be adjusted by change order. ",l.jsx(In,{href:"https://www.txdot.gov/manuals/cst/cah/prosecution_and_progress/contract_time-bceeiiih.html",children:"The Texas DOT Construction Contract Administration Manual"})," says time is charged by the standard workweek method unless the contract says otherwise, and that the number of working days can be adjusted by change order in extraordinary circumstances. At final estimate, each job carries a count of days charged and a count of days allowed. Comparing the two for 10,041 completed construction jobs shows a pattern that a natural spread of finish times would not produce."]}),l.jsx("p",{children:"1,682 jobs, or 17%, were charged exactly the days they were allowed. Only 83 were charged one day more, and 559 were charged one day fewer. The allowed day holds 6.7 times the daily average of the three days on either side of it. Beyond the spike, 61% of jobs were charged fewer days than allowed and 22% more, so the spike sits between two much broader groups."}),l.jsx(en,{children:l.jsx(tn,{n:1,title:"Texas DOT jobs by days charged against days allowed",takeaway:"1,682 jobs landed exactly on the allowed day, against 83 one day late and 559 one day early.",source:"Mastt analysis of public contract records, Texas DOT, 10,041 completed construction contracts awarded mostly between 2009 and 2025.",note:"The chart shows the 5,203 jobs (52%) within 10 days either side of the allowed day.",children:l.jsx(Sk,{label:"Jobs by days charged minus days allowed",period:"10 days early to 10 days late",unit:"jobs",averageLabel:"Average jobs per day shown",valueLabel:"Jobs",categoryLabel:"Days charged minus days allowed",height:220,data:n})})}),l.jsx("p",{children:"The pattern is easier to explain by how records close than by how crews work. About 41% of jobs received extra days by change order. Those jobs landed exactly on their new allowed day 23.5% of the time. Jobs with no extra days were charged exactly their original days 12.0% of the time. That gap suggests the recorded finish is often a number agreed at close-out, not only a measurement taken on site. The pile-up is in the records. The explanation is our reading."}),l.jsx(la,{children:l.jsx("p",{children:"When you assess a time claim or a delay analysis, the final finish date may have been sized to fit. Keep the daily progress records from during the job, because they hold evidence that a final time statement may not."})}),l.jsxs(ri,{title:"One job in six is running late at any moment",children:[l.jsxs("p",{children:["Monthly district reports on active construction jobs give a view of work in progress. On 11 January 2017, ",t.pastPct.toFixed(1),"% of ",Dn(t.n)," active Texas DOT jobs had already used more than their allowed days. On 10 November 2024, the figure was ",e.pastPct.toFixed(1),"% of ",Dn(e.n)," jobs. The statewide book of active work grew from $",t.amountBn," billion to $",e.amountBn," billion between those dates, before any adjustment for inflation, and the share running late hardly moved."]}),l.jsx(en,{children:l.jsx(tn,{n:2,title:"Active Texas DOT construction jobs past their allowed days",takeaway:"About one active job in six had used more than its allowed days on both dates.",source:"Mastt analysis of public contract records, Texas DOT monthly district progress reports, January 2017 and November 2024.",children:l.jsxs("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(14rem, 1fr))",gap:24,justifyItems:"center"},children:[l.jsx(Sg,{label:"January 2017",value:t.pastPct,detail:`of ${Dn(t.n)} active jobs`}),l.jsx(Sg,{label:"November 2024",value:e.pastPct,detail:`of ${Dn(e.n)} active jobs`})]})})}),l.jsx("p",{children:"A portfolio with about one job in six past its allowed time is in line with the Texas DOT record. A much higher share is a reason to look hard at the schedule."})]})]}),l.jsxs(Za,{id:"halfway",title:"Does the halfway mark predict late penalties?",children:[l.jsxs(ri,{title:"Late penalties are common but small",children:[l.jsx("p",{children:"22% of the 10,041 jobs, 2,201 in all, were charged late penalties, which Texas DOT calls liquidated damages. The typical penalised job was charged for 21 days and $18,000, which is 0.7% of its contract value. All penalties together came to $109 million on $57 billion of awarded work."}),l.jsx(en,{children:l.jsx(V1,{items:[{label:"Jobs charged late penalties",value:22,suffix:"%",context:"2,201 of 10,041 completed jobs"},{label:"Typical days charged",value:21,context:"Median among penalised jobs"},{label:"Typical penalty in US dollars",value:18e3,context:"Median among penalised jobs"},{label:"All penalties charged, US$ millions",value:109,context:"On $57 billion of awarded work"}]})}),l.jsxs("p",{children:["Texas DOT describes these charges as ",l.jsx(In,{href:"https://www.txdot.gov/manuals/cst/cah/prosecution_and_progress/progress_schedules-bcejejfc/failure_to_complete_work_on_time-i1019822.html",children:"cost recovery, not a penalty"}),", and sets the daily rate from the original bid value of the contract. Federal highway rules require each state transportation department to set rates that cover, as a minimum, the estimated average daily construction engineering cost (",l.jsx(In,{href:"https://www.law.cornell.edu/cfr/text/23/635.127",children:"23 CFR 635.127"}),"). That points to why the amounts stay small. A rate built around the owner's daily engineering cost does not try to price the full cost of delay."]})]}),l.jsxs(ri,{title:"The halfway check",children:[l.jsx("p",{children:"The monthly reports also show the percent of time used and the percent of money earned. In January 2017, 436 active construction jobs were between 20% and 80% of the way through their allowed time. Matching them to their final records shows how the gap between time used and money earned at that point lined up with penalties at the end."}),l.jsx("p",{children:"Jobs whose earnings were level with or ahead of their time used ended with penalties 10% of the time. Jobs more than 10 points behind ended with penalties 47% of the time, almost five times as often, and the penalised ones were charged a median of 46 days late. Among jobs more than 20 points behind, 55% paid penalties."}),l.jsx(en,{children:l.jsx(tn,{n:3,title:"Late-penalty rate by gap between time used and money earned at the halfway mark",takeaway:"The further a job trails its time at the halfway mark, the more likely it ends with penalties.",source:"Mastt analysis of public contract records, Texas DOT, 436 construction jobs active in January 2017 and matched to their final records.",note:"One snapshot date so far, and the bands are small (270, 70, 43 and 53 jobs), so read the pattern rather than each point.",children:l.jsx(X1,{label:"Share of jobs charged late penalties",categoryLabel:"Gap between time used and money earned",curve:"linear",height:240,series:[{key:"rate",label:"Charged late penalties"}],data:Bg.map(s=>({key:s.key,label:`${s.label} (${s.jobs} jobs)`,axisLabel:s.axisLabel,values:{rate:s.rate}})),formatValue:Aa,formatTick:s=>`${s}%`})})}),l.jsx("p",{children:"The check uses two numbers most project teams already hold. Compare the percent of time used with the percent of money earned at about the halfway point. A job that has used 50% of its time and earned 30% of its money is 20 points behind."})]}),l.jsxs(la,{children:[l.jsx("p",{children:"Add a time-against-money gap line to your monthly report. Treat a gap of more than 10 points near the halfway mark as a trigger to review the program, not as a footnote. This is a single snapshot, so test the thresholds against your own history before you set hard limits."}),l.jsx("p",{children:"Do not count on penalties to recover delay costs. They are common, but the typical charge is under 1% of contract value, so they are unlikely to cover what a late job costs the owner."})]})]}),l.jsxs(Za,{id:"change",title:"How much does the work change under the net figure?",children:[l.jsx("p",{children:"Final cost against award is the number most reports show. On 5,265 completed Texas DOT construction contracts with about $30 billion awarded, each matched line by line to its bid, the net change was 5.0%. Underneath that figure, three movements pulled in different directions. Items in the original bid were paid 3.9% below their awarded value. Item types that were never in the bid added 7.5%. Force account work and price adjustments added another 1.4%. Adding the movements up without regard to direction, 12.8% of contract value changed, or 13%."}),l.jsx(en,{children:l.jsxs(B1,{children:[l.jsx(tn,{n:4,title:"Where the 13% of movement came from",takeaway:"Item types not in the bid added the most, and original items paid below their bid value pulled the other way.",source:"Mastt analysis of public contract records, Texas DOT, 5,265 completed construction contracts, about $30 billion awarded.",note:"Shares of the awarded amount. Net change was 5.0%. Gross change adds every movement regardless of direction.",wide:!1,children:l.jsx(FD,{label:"Gross movement in contract value",unit:"of award",totalLabel:"Gross change",formatValue:s=>`${s.toFixed(1)}%`,data:kL.map(s=>({key:s.id,label:s.label,value:s.value}))})}),l.jsx(tn,{n:5,title:"How Texas DOT bid lines ended",takeaway:"About one bid line in seven was never paid, and 39% ended at exactly the bid quantity.",source:"Mastt analysis of public contract records, Texas DOT, 341,637 bid lines on 5,265 completed construction contracts.",note:"Each square is one percent of bid lines.",wide:!1,children:l.jsx(sg,{label:"Bid lines by outcome",unit:"of bid lines",accentKey:"unused",decimals:1,formatValue:s=>`${s.toFixed(1)}%`,data:qL})})]})}),l.jsx("p",{children:"The change is broad as well as large. Across 341,637 bid lines on the same 5,265 contracts, 13.4% were never paid at all, about 1 in 7. Only 39.1% ended at exactly the bid quantity. 17.6% overran by more than 10%, and 30.6% underran by more than 10% when the unpaid lines are counted. Vegetative watering went unused on 58% of the jobs that bid it. That points to quantities set with a margin. A check of bid quantities can find them before the work is priced."}),l.jsx(DE,{children:"One bid line in seven is never paid, and fewer than two in five end at the quantity bid."}),l.jsxs("p",{children:["Other public owners report net figures too. The Victorian Auditor-General reported a net rise of 8.7% in total estimated investment across 113 major projects worth $145.5 billion in ",l.jsx(In,{href:"https://www.audit.vic.gov.au/node/34906",children:"its 2024 review"}),". A net figure of that kind does not show how many projects moved up or down, or by how much, which is the same limit the Texas DOT contracts show."]}),l.jsx(la,{children:l.jsx("p",{children:"Report gross additions and gross reductions beside the net figure in your change register. Check quantities, especially for temporary and erosion-control items, before tender. Carry an allowance for item types that are not in the bid, because they were the largest single driver of change on these jobs."})})]}),l.jsxs(Za,{id:"size",title:"Do bigger jobs change more?",children:[l.jsx("p",{children:"Yes, and by a wide margin. 79% of Texas DOT jobs over $20m received extra days, against 8% of jobs under $100k. Jobs of $1m to $5m got extra days 41% of the time and jobs of $5m to $20m 58% of the time. The median extension among jobs that got extra days grows from 5 days under $100k to 112 days over $20m. Median cost growth rises from -0.3% on jobs under $100k to 5.2% on jobs over $20m."}),l.jsx(en,{children:l.jsx(tn,{n:6,title:"Extra days and late penalties by job size",takeaway:"Extra days climb with size, while the share of jobs charged penalties levels off above $1m.",source:"Mastt analysis of public contract records, Texas DOT, 9,980 completed construction contracts with a recorded awarded amount, in six size bands.",note:"Bands run from 102 jobs under $100k to 4,329 jobs of $1m to $5m.",children:l.jsx(X1,{label:"Share of jobs by size band",categoryLabel:"Awarded amount",curve:"linear",height:260,series:[{key:"extra",label:"Received extra days"},{key:"pen",label:"Charged late penalties",area:!1}],data:cd.map(s=>({key:s.band,label:`${s.band} (${Dn(s.jobs)} jobs)`,axisLabel:["<$100k","$100k+","$500k+","$1m+","$5m+","$20m+"][cd.indexOf(s)],values:{extra:s.extraDays,pen:s.penalised}})),formatValue:Aa,formatTick:s=>`${s}%`})})}),l.jsx("p",{children:"The daily late-penalty rate rises with size, from a median $570 a day under $100k to $2,590 a day over $20m. The share of jobs actually penalised does not follow. It sits between 21% and 24% for every band from $1m up. Extra days climb with size far more than penalty rates do."}),l.jsx(en,{children:l.jsx(tn,{n:7,title:"Texas DOT size bands compared",takeaway:"Extra days and cost growth rise with size, while penalty rates level off. Click a column heading to sort.",source:"Mastt analysis of public contract records, Texas DOT, 9,980 completed construction contracts with a recorded awarded amount, 9,979 with cost growth.",note:"Extra days and penalised are shares of jobs. Cost growth is final cost against awarded amount. The middle half is the range from the 25th to the 75th percentile. Daily rate is the median late-penalty rate.",children:l.jsx("div",{style:{minWidth:760},children:l.jsx(If,{rowKey:"band",caption:"Texas DOT completed construction contracts by awarded amount",rows:cd,columns:[{key:"band",label:"Awarded amount",sortable:!1,width:150},{key:"jobs",label:"Jobs",numeric:!0,width:80,render:s=>Dn(s)},{key:"extraDays",label:"Extra days",numeric:!0,width:100,render:s=>Aa(s)},{key:"penalised",label:"Penalised",numeric:!0,width:100,render:s=>Aa(s)},{key:"growthMedian",label:"Median growth",numeric:!0,width:120,render:s=>Aa(s)},{key:"growthP75",label:"Middle half",numeric:!0,width:150,render:(s,i)=>`${i.growthP25.toFixed(1)}% to ${s.toFixed(1)}%`},{key:"rateMedian",label:"Daily rate",numeric:!0,width:100,render:s=>`$${Dn(s)}`}]})})})}),l.jsx("p",{children:"The spread widens with size as well. The middle half of jobs under $100k moved between -3.6% and +3.0%. For jobs over $20m, the middle half moved between +1.5% and +11.0%. The whole distribution shifts right as jobs grow, and the right tail stretches."}),l.jsx(en,{children:l.jsx(tn,{n:8,title:"How cost growth is distributed by job size",takeaway:"The peak moves right and the tail lengthens as jobs get bigger.",source:"Mastt analysis of public contract records, Texas DOT, 9,979 completed construction contracts.",note:"Rows are labelled by the lower end of each size band in US dollars and shaded by median. About 5% of jobs fall outside -20% to +40% and are not drawn.",children:l.jsx(cC,{label:"Cost growth by size band",series:AL.map((s,i)=>({...s,label:["<100k","100k+","500k+","1m+","5m+","20m+"][i]})),domain:[-20,40],formatValue:s=>`${s.toFixed(0)}%`,rowHeight:58,tint:!0})})}),l.jsx(la,{children:l.jsx("p",{children:"Set contingency by job size. A flat percentage is too much for small jobs and too little for big ones. For work over $20m, plan for days as well as dollars, because four in five such jobs received extra time."})}),l.jsxs(ri,{title:"Districts differ inside one owner",children:[l.jsx("p",{children:"Twenty-five Texas DOT districts work under the same owner, specifications and contract forms. Median cost growth runs from +5.3% in Houston to -0.5% in Lufkin. The share of jobs charged late penalties runs from 13% in Odessa to 39% in San Angelo. Work mix and local markets may explain some of that spread. The rest points to local practice."}),l.jsx(en,{children:l.jsx(tn,{n:9,title:"Texas DOT districts compared",takeaway:"Cost growth and penalty rates differ widely across districts with the same rules.",source:"Mastt analysis of public contract records, Texas DOT, 25 districts, completed construction contracts.",note:"Sorted by median cost growth. Click a heading to re-sort.",children:l.jsx("div",{style:{minWidth:600},children:l.jsx(If,{rowKey:"district",caption:"Texas DOT districts by median cost growth",defaultSort:{key:"growthMedian",direction:"desc"},rows:EL,columns:[{key:"district",label:"District",width:160},{key:"jobs",label:"Jobs",numeric:!0,width:80,render:s=>Dn(s)},{key:"growthMedian",label:"Median growth",numeric:!0,width:130,render:s=>Aa(s)},{key:"penalised",label:"Penalised",numeric:!0,width:110,render:s=>Aa(s)},{key:"extraDays",label:"Extra days",numeric:!0,width:110,render:s=>Aa(s)}]})})})}),l.jsx(la,{title:"What this means for benchmarking",children:l.jsx("p",{children:"Compare like with like. A statewide average hides large regional differences, so benchmark a program against the closest region and work mix, not against the headline average."})})]})]}),l.jsxs(Za,{id:"firms",title:"Who delivers the work?",children:[l.jsxs("p",{children:["Subcontracting is the norm on Texas DOT work. Across ",Dn(3632)," active construction jobs in the January 2017 and November 2024 reports, ",di.declarePct.toFixed(0),"% declared subcontractors, and the median active job listed ",di.medianSubs,". The median share of contract value declared as subcontracted was between ",Math.round(di.medianPct[0]),"% and ",Math.round(di.medianPct[1]),"% across the two dates. Weighted by dollars it was between ",Math.round(di.wtdPct[0]),"% and ",Math.round(di.wtdPct[1]),"%, because larger jobs subcontract more."]}),l.jsx(en,{children:l.jsx(V1,{items:[{label:"Active jobs declaring subcontractors",value:77,suffix:"%",context:"Jobs listed in two statewide snapshots"},{label:"Median subcontractors per active job",value:5,context:"Across all 3,632 active jobs"},{label:"Contract dollars subcontracted, 2024",value:22,suffix:"%",context:"25% in January 2017, weighted by dollars"}]})}),l.jsx("p",{children:"Firms new to Texas DOT work were charged late penalties on 26% of their first jobs, against 20% for established firms. New here means no Texas DOT award before 2012, and the comparison covers jobs from 2012 onward. On their second to fifth jobs the new firms were at 27%, and on their sixth to twentieth at 26%. That suggests the gap is about the firm and not only the first job. Firms that reach 21 or more jobs are the survivors, which may explain the lower rate in the last group."}),l.jsx(en,{children:l.jsx(tn,{n:10,title:"Share of jobs charged late penalties by firm experience",takeaway:"New firms were charged late penalties on about a quarter of their jobs, from the first through to the twentieth.",source:"Mastt analysis of public contract records, Texas DOT, completed construction jobs from 2012 onward, 9,038 jobs.",note:"New means no Texas DOT award of any kind before 2012. Twenty first jobs were checked by hand against the source records.",children:l.jsx(hi,{rows:NL.map(s=>({label:s.label,jobs:s.jobs,value:s.rate})),unit:"jobs"})})}),l.jsx(la,{children:l.jsx("p",{children:"Treat a new bidder as a modest extra risk, not a disaster. Ask for a track record with other owners. With about five subcontractors on a typical job, plan the paperwork and the payment chain for that many firms from the start."})})]}),l.jsxs(Za,{id:"federal",title:"How often do US federal contracts change after signing?",children:[l.jsx("p",{children:"Of 73,571 completed US federal construction contracts over $1m, 78.5% changed in value after signing, and 38% received a formal change order. 74% ran past their original end date. The median shift in end date across all of these contracts was 150 days, and 258 days among those that were extended. Leaving out option exercises, the typical value growth was 2.9%, and one contract in ten grew by about 31% or more. Across all 583,728 completed contracts from federal fiscal years 2008 to 2026, 39% changed in value and 16% received a change order."}),l.jsxs("p",{children:["Change orders are a designed part of the system. The standard federal construction changes clause lets the contracting officer order changes within the general scope of the contract, and requires an equitable adjustment when a change affects cost or time (",l.jsx(In,{href:"https://www.acquisition.gov/far/52.243-4",children:"FAR 52.243-4"}),"). The US Government Accountability Office reported in 2019 that federal agencies spent more than $36 billion on construction contracts in fiscal year 2018, and that neither the General Services Administration nor the Army Corps of Engineers regularly monitors how long it takes to finalise construction contract changes (",l.jsx(In,{href:"https://www.gao.gov/products/gao-19-500",children:"GAO-19-500"}),"). Where finalising a change is not tracked, delay in pricing it is hard to see."]}),l.jsx(en,{children:l.jsx(tn,{n:11,title:"What the change rate depends on",takeaway:"Contract type, number of offers and type of work each move the rate. Firm size does not.",source:"Mastt analysis of public contract records, US federal construction contracts, 583,728 completed contracts, federal fiscal years 2008 to 2026.",note:"Shares are on a 0 to 100 scale. The work tab counts contracts with at least one formal change order. The other tabs count contracts that changed in value.",children:l.jsxs(H$,{defaultValue:"type",children:[l.jsxs(q$,{"aria-label":"Split the federal change rate",children:[l.jsx(Zl,{value:"type",children:"Contract type"}),l.jsx(Zl,{value:"offers",children:"Number of offers"}),l.jsx(Zl,{value:"work",children:"Type of work"}),l.jsx(Zl,{value:"size",children:"Firm size"})]}),l.jsxs(Il,{value:"type",children:[l.jsx("p",{style:{margin:"14px 0 18px",color:"var(--text-secondary)",fontSize:15},children:"Share of contracts that changed in value, by pricing type."}),l.jsx(hi,{rows:RL.map(s=>({label:s.label,jobs:s.jobs,value:s.rate}))})]}),l.jsxs(Il,{value:"offers",children:[l.jsx("p",{style:{margin:"14px 0 18px",color:"var(--text-secondary)",fontSize:15},children:"Share of contracts that changed in value, by number of offers received."}),l.jsx(hi,{rows:CL.map(s=>({label:s.label,jobs:s.jobs,value:s.rate}))})]}),l.jsxs(Il,{value:"work",children:[l.jsx("p",{style:{margin:"14px 0 18px",color:"var(--text-secondary)",fontSize:15},children:"Share of contracts with at least one formal change order, by industry group."}),l.jsx(hi,{rows:OL.map(s=>({label:s.label,jobs:s.jobs,value:s.coRate}))})]}),l.jsxs(Il,{value:"size",children:[l.jsx("p",{style:{margin:"14px 0 18px",color:"var(--text-secondary)",fontSize:15},children:"Share of contracts that changed in value, by business size of the awardee."}),l.jsx(hi,{rows:[{label:"Small businesses",jobs:456539,value:39.2},{label:"Other than small businesses",jobs:127189,value:38.8}]})]})]})})}),l.jsxs("p",{children:["Cost-plus contracts changed in value 71% of the time, against 39% for firm fixed price. Under the federal cost-reimbursement rules, the contract states an estimated total cost that works as a ceiling the contractor may not exceed, except at its own risk, without the contracting officer's approval (",l.jsx(In,{href:"https://www.acquisition.gov/far/16.301-1",children:"FAR 16.301-1"}),"), so growth on these jobs can reflect a ceiling being raised. The top tenth of cost-plus contracts grew by more than 285%, against 19.5% for firm fixed price. Cost-plus work is rare in construction, with 1,094 contracts against 576,302 firm fixed price."]}),l.jsx("p",{children:"Single-bid contracts changed less often, 37% against 46% for contracts with three or four offers. One bidder does not mean a runaway job. Single offers may be more common on small or specialist work, which changes less anyway. By type of work, 29% of other heavy and civil contracts had a change order, against 8% for building finishing. Utility systems stood at 19%, non-residential building at 18%, highways and bridges at 14%, and residential building at 9%."}),l.jsx("p",{children:"Firm size alone does not predict change. Small businesses and larger firms both saw about 39% of contracts change in value. Larger firms collected more formal change orders per contract, 0.57 against 0.34, which may reflect the longer and bigger jobs they take on."}),l.jsx(la,{children:l.jsx("p",{children:"On big federal jobs, change is the normal case. Plan contingency and administration for it from day one. Watch cost-plus jobs far more closely than fixed-price ones, and set contingency by type of work, with more for civil and utility work than for finishing trades."})})]}),l.jsxs(Za,{id:"compare",title:"How do Australian and US contract changes compare?",children:[l.jsx("p",{children:"The size rule holds in both countries. In US federal contracts, the share changing in value rises from 24% under $100k to 88% at $10m to $100m. In Commonwealth construction contract notices, the share amended rises from 15% to 72% over the same span. At every size band, the US share is higher, although the two are within one point at $100k to $1m."}),l.jsx(en,{children:l.jsx(tn,{n:12,title:"Share of contracts changed in value by size, US federal against Australia",takeaway:"The bigger the contract, the more likely it changes in both countries, and the US share is higher at every size.",source:"Mastt analysis of public contract records, US federal construction contracts (583,728 completed) and Commonwealth construction contract notices (31,773, mostly signed 2013 to 2026).",note:"Each country records change differently. Sizes are in US dollars and Australian dollars with no conversion.",children:l.jsx(FN,{label:"Share of contracts changed in value by size band",startLabel:"US federal",endLabel:"Australia",height:300,formatValue:UL,formatChange:s=>`${s>0?"+":""}${s.toFixed(0)} points`,highlightKey:(a=Ug[3])==null?void 0:a.key,data:Ug.map(s=>({key:s.key,label:s.label,start:s.start,end:s.end}))})})}),l.jsxs("p",{children:["The two records are not the same measure. US records type every modification, and the figure here counts any modification that changed contract value. Commonwealth notices record only whether a contract was amended, and amendments include time extensions and option exercises as well as scope changes. Under Department of Finance guidance, ",l.jsx(In,{href:"https://finance.gov.au/publications/resource-management-guides/procurement-publishing-and-reporting-obligations-rmg-423/contracting-reporting",children:"options, extensions and renewals that change a contract's value by $10,000 or more"})," are reported as amendments to the original contract notice. Even so, the direction is the same."]}),l.jsxs("p",{children:["33.6% of the 31,773 Commonwealth construction contract notices were amended at least once. The Commonwealth Procurement Rules set a ",l.jsx(In,{href:"https://www.finance.gov.au/government/procurement/commonwealth-procurement-rules/procurement-method",children:"$7.5 million threshold for construction services"}),", and 73% of the 890 contracts at or above that level were amended. Big public jobs change often in all three sets of records. 70% of Texas DOT jobs over $10m received extra days, 73% of Commonwealth contracts over $7.5m were amended, and 78.5% of US federal contracts over $1m changed in value. The definitions differ, so the figures show a common pattern and not a ranking."]}),l.jsxs(ri,{title:"Defence is most of the federal record",children:[l.jsx("p",{children:"The Department of Defense awarded 62% of the completed US federal construction contracts, 363,102 of 583,728. In Australia, Defence holds 53% of the contract notices and 69% of the amended ones. US Defense contracts changed in value slightly less often than the average, 36.5% against 39.1%. Australian Defence contracts were amended more often than the rest, 43% against 22%."}),l.jsx(en,{children:l.jsx(tn,{n:13,title:"Who buys the work, and how often it changes",takeaway:"Defence is the largest single buyer in both countries, and agencies under the same rules change contracts at very different rates.",source:"Mastt analysis of public contract records, US federal construction contracts and Commonwealth construction contract notices.",note:"Tile size is the number of contracts. Shade is the share that changed in value, on the same 0 to 60 scale in both views. Click a tile to open it.",children:l.jsx(HL,{})})}),l.jsx("p",{children:"Agencies working under the same federal rules differ widely. Justice changed 19% of its contracts in value, Interior 51% and Transportation 54%. The top tenth of Federal Aviation Administration contracts grew by about 490%. Practice inside each agency matters as much as the rules."}),l.jsx(la,{children:l.jsx("p",{children:"Any national federal benchmark is mostly a Defence benchmark, so split it out before you compare it with your own portfolio. When you borrow a figure from another country, check how that country defines change before you use it."})})]}),l.jsxs(ri,{title:"Contract change is not budget growth",children:[l.jsxs("p",{children:["Contract growth and budget growth are different measures, and they differ by an order of magnitude. Median cost growth on completed contracts is close to 2% for both Texas DOT and Florida DOT. Completed New York City capital projects, measured from the first recorded budget, grew by a median of 28%, a figure that includes funding added in stages. The measures are not like for like, but a gap this size suggests that much of the growth in a public project budget happens before award or sits outside the contract. A 2002 study in the Journal of the American Planning Association points the same way. Its ",l.jsx(In,{href:"https://arxiv.org/abs/1303.6604",children:"sample of 258 transport projects worth US$90 billion"})," showed cost estimates that were systematically misleading."]}),l.jsx(en,{children:l.jsx(tn,{n:14,title:"Median cost growth by owner and measure",takeaway:"Contract-level growth is small. Project-budget growth is many times larger.",source:"Mastt analysis of public contract records, Texas DOT, Florida DOT and New York City capital projects.",note:"The bases differ and are shown in the table. The New York City figure includes funding added in stages.",children:l.jsx("div",{style:{minWidth:690},children:l.jsx(If,{rowKey:"owner",caption:"Median cost growth on completed work",rows:zL,columns:[{key:"owner",label:"Owner",width:130},{key:"basis",label:"What is measured",width:330},{key:"jobs",label:"Jobs",numeric:!0,width:80,render:s=>Dn(s)},{key:"median",label:"Median growth",numeric:!0,width:130,render:s=>Aa(s)}]})})})}),l.jsx(la,{children:l.jsx("p",{children:"Hold a contingency for change inside the contract and a second allowance for change that enters through scope, staging and escalation outside it. A contract benchmark of 2% will not cover a project budget that has historically grown by far more."})})]})]}),l.jsxs(Za,{id:"risk",title:"What do public risk registers plan for?",children:[l.jsx("p",{children:"The risk register is where a project team writes down what it expects to go wrong. We read the latest version of 64 public project risk registers, 53 Australian and 11 US, covering terminal stations, motorways, rail, aquatic centres, galleries and other public works. The most common themes are community and stakeholders, approvals, weather and heritage. Contractor insolvency, by contrast, is rare."}),l.jsx("p",{children:"9 of the 64 registers, 14%, mention a contractor or subcontractor going insolvent. Only 3 of the 18 Australian registers dated 2022 or later do, and seven of those 18 come from one network company. Each match was read by hand. Where a fix is given, it is usually a financial check of the contractor at tender."}),l.jsx(en,{children:l.jsxs(B1,{children:[l.jsx(tn,{n:15,title:"Risk registers that mention contractor insolvency",takeaway:"Nine of 64 registers, about one in seven, plan for it.",source:"Mastt analysis of public project risk registers, 53 Australian and 11 US, latest version of each.",wide:!1,children:l.jsx(sg,{label:"Public risk registers by mention of contractor insolvency",unit:"registers",accentKey:"mention",decimals:0,data:VL.map(s=>({...s,label:s.key==="mention"?"Yes":"No"})),formatValue:s=>`${s} registers`})}),l.jsx(tn,{n:16,title:"Share of registers mentioning each theme",takeaway:"Contractor insolvency and cyber risk sit at the bottom of the list.",source:"Mastt analysis of public project risk registers, 64 registers.",note:"Theme shares come from keyword matching across the text of each register, so they are upper bounds. The insolvency count was read by hand.",wide:!1,children:l.jsx(hi,{rows:BL.map(s=>({label:s.label,jobs:s.count,value:s.pct})),unit:"of 64"})})]})}),l.jsxs("p",{children:["The same reading shows other gaps. Climate change is mentioned in six registers, but in only three as a risk to the project. In the other three it appears in a definitions legend or as the project's own emissions. None of the 64 registers mention cyber risk, and about one in five, 13 of 64, still mention COVID or pandemics. Contractor failure is a known issue in Australian public work. A Senate inquiry into the scale and incidence of insolvency in the construction industry ",l.jsx(In,{href:"https://www.aph.gov.au/Parliamentary_Business/Committees/Senate/Economics/Insolvency_construction/Report",children:"reported on 3 December 2015"}),". Much of the evidence it received, particularly on security of payment and imbalances in market power, was critical of the large companies at the top of the contracting chain."]}),l.jsx(la,{children:l.jsx("p",{children:"Put contractor insolvency in the register, with a trigger to recheck the contractor's finances during the job, not only at tender. For assets that will be in service for decades, put climate risk in the project register where the team will see it."})})]}),l.jsx("div",{className:"faq wide",id:"faq",children:l.jsx(Xw,{variant:"accordion",title:"FAQs",description:"Short answers, each led by the figure.",multiple:!0,contact:null,items:[{question:"How often do Texas DOT construction jobs finish on time?",answer:"17% of 10,041 completed Texas DOT construction jobs were charged exactly the days they were allowed. 61% were charged fewer days and 22% more, and only 1% finished one day late."},{question:"How large are late penalties on Texas DOT jobs?",answer:"22% of Texas DOT jobs were charged late penalties, and the typical penalty was $18,000, or 0.7% of contract value. Texas DOT describes the charge as cost recovery, not a penalty, and sets the daily rate from the bid value of the contract."},{question:"How much do public construction contracts change after signing?",answer:"78.5% of US federal construction contracts over $1m changed in value after signing. 73% of Commonwealth contracts of $7.5m or more were amended, and Texas DOT jobs showed a 5% net change that hid 13% gross movement."},{question:"Do cost-plus contracts change more than fixed-price contracts?",answer:"Yes. 71% of US federal cost-plus construction contracts changed in value, against 39% of firm fixed-price contracts. The top tenth of cost-plus contracts grew by more than 285%."},{question:"Which jobs need the most contingency?",answer:"Bigger jobs and civil work. 79% of Texas DOT jobs over $20m received extra days against 8% under $100k, and 29% of US federal heavy civil contracts had a change order against 8% for finishing trades."},{question:"How common is contractor insolvency in project risk registers?",answer:"9 of 64 public project risk registers, 14%, mention it. Only 3 of 18 Australian registers dated 2022 or later do."},{question:"Can Texas DOT figures be applied to other owners?",answer:"No. Texas DOT figures describe Texas DOT work only. Use them as a reference for similar road and bridge work, and test them against an owner's own records."}]})}),l.jsx(NE,{citeAs:"Mastt, State of Public Construction Delivery 2027, mastt.com.",methodology:l.jsxs(l.Fragment,{children:[l.jsxs("p",{children:[l.jsx("b",{children:"Records."})," Mastt analysed published contract and project records. Texas DOT records cover 10,041 completed construction contracts, awarded mostly between 2009 and 2025, of which 5,265 were matched line by line to their bids, plus monthly progress reports on 3,632 active jobs in January 2017 and November 2024. US federal records cover 583,728 completed construction contracts and delivery orders from federal fiscal years 2008 to 2026. Australian records cover 31,773 Commonwealth construction contract notices, mostly signed between 2013 and 2026. Florida DOT and New York City records add 431 and 1,142 completed projects. The risk register analysis covers 64 public registers, 53 Australian and 11 US."]}),l.jsxs("p",{children:[l.jsx("b",{children:"Filters."})," Texas DOT work is limited to construction contracts and excludes maintenance and supply contracts. Days allowed are the bid days plus days added by change order, and a late penalty is any charge for days over that time. Cost growth is measured on jobs awarded at $10,000 or more. For US federal work, completed means the final end date had passed, and a contract changed in value if any modification altered its value. Size bands use the original contract value."]}),l.jsxs("p",{children:[l.jsx("b",{children:"Limits."})," These are public records, so figures show what was recorded and not always what happened on site. Recent contracts lean toward shorter jobs because long jobs are still open. Reasons given for patterns are our reading, not proof. The halfway check rests on one snapshot date. Definitions differ between countries and dollars are not converted. Texas figures describe Texas DOT work only."]}),l.jsx("p",{children:"Includes public sector information from Australian federal, state, territory and local governments, used under Creative Commons Attribution 4.0 licences."})]}),items:[{publisher:"Texas Department of Transportation",title:"Failure to Complete Work on Time, Construction Contract Administration Manual",url:"https://www.txdot.gov/manuals/cst/cah/prosecution_and_progress/progress_schedules-bcejejfc/failure_to_complete_work_on_time-i1019822.html"},{publisher:"Texas Department of Transportation",title:"Section 4: Contract Time, Construction Contract Administration Manual",url:"https://www.txdot.gov/manuals/cst/cah/prosecution_and_progress/contract_time-bceeiiih.html"},{publisher:"US Code of Federal Regulations",title:"23 CFR 635.127, Agreement provisions regarding overruns in contract time",url:"https://www.law.cornell.edu/cfr/text/23/635.127"},{publisher:"Federal Acquisition Regulation",title:"52.243-4 Changes (June 2007)",url:"https://www.acquisition.gov/far/52.243-4"},{publisher:"Federal Acquisition Regulation",title:"16.301-1 Description, cost-reimbursement contracts",url:"https://www.acquisition.gov/far/16.301-1"},{publisher:"US Government Accountability Office",date:"July 2019",title:"Federal Construction: Army Corps of Engineers and GSA Need to Improve Data on Contract Changes, GAO-19-500",url:"https://www.gao.gov/products/gao-19-500"},{publisher:"Journal of the American Planning Association 68(3)",date:"2002",title:"Underestimating Costs in Public Works Projects: Error or Lie?",url:"https://arxiv.org/abs/1303.6604"},{publisher:"Victorian Auditor-General's Office",date:"February 2025",title:"Major Projects Performance Reporting 2024",url:"https://www.audit.vic.gov.au/node/34906"},{publisher:"Australian Government Department of Finance",title:"Commonwealth Procurement Rules, Procurement method",url:"https://www.finance.gov.au/government/procurement/commonwealth-procurement-rules/procurement-method"},{publisher:"Australian Government Department of Finance",title:"Procurement Publishing and Reporting Obligations (RMG 423), Contracting and reporting",url:"https://finance.gov.au/publications/resource-management-guides/procurement-publishing-and-reporting-obligations-rmg-423/contracting-reporting"},{publisher:"Senate Economics References Committee, Parliament of Australia",date:"December 2015",title:"Insolvency in the Australian construction industry",url:"https://www.aph.gov.au/Parliamentary_Business/Committees/Senate/Economics/Insolvency_construction/Report"}]})]})}ZS.createRoot(document.getElementById("root")).render(l.jsx(p.StrictMode,{children:l.jsx(PL,{})}));</script>
