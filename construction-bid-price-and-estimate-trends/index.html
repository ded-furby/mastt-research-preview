bles those jobs before you use it."}),l.jsxs("ul",{children:[l.jsxs("li",{children:[l.jsx("strong",{children:"Escalation."})," Bid prices rose 23.4% in 2022 and 17.0% in 2023 on the Texas basket, and estimates took about a year to follow. Add escalation in the quarter prices begin to move, and check the budget against the latest bids instead of last year's."]}),l.jsxs("li",{children:[l.jsx("strong",{children:"Thin competition."})," Jobs with one or two bidders were won a median 5% to 18% over the estimate, with a wide spread. When tender interest is thin, test the budget against that range rather than adding a fixed premium."]}),l.jsxs("li",{children:[l.jsx("strong",{children:"Change inside the contract."})," A 5.0% net change hid 12.8% gross movement, and 78% of jobs gained an item type that was not in the tender. Start contingency from net growth on comparable jobs (a median -0.3% under $100k to +5.2% over $20m), set it above the median to match the overrun risk the project can carry, and use the gross figure to plan the change-management effort."]}),l.jsxs("li",{children:[l.jsx("strong",{children:"Named costs."})," Police traffic control and environmental change orders recur across many jobs, and contamination is rare but large where it occurs. Carry these as named allowances so general contingency stays for risks no one has priced yet."]})]}),l.jsx(R8,{children:"Across completed Texas DOT construction contracts, a 5% net change hid at least 12.8% of contract value moving after award."}),l.jsx(vi,{title:"What this means for project teams",children:l.jsx("p",{children:"Treat these Texas figures as benchmarks and check how closely your project matches the jobs behind them in size, work type, competition and timing. Set escalation from an index you can name, test the budget against the one and two bidder range when interest is thin, start contingency from net growth on comparable jobs, and report gross additions and reductions next to the net figure."})})]}),l.jsx(N8,{items:[{question:"How much did Texas DOT bid prices rise from 2017 to 2024?",answer:"A fixed basket of 523 Texas DOT bid items rose 68% between 2017 and 2024, from an index of 100 to 168.3 in winning bid prices. The engineer's estimate for the same items rose 70%, to 170.0."},{question:"Did winning bids come in above the engineer's estimate in 2022?",answer:"Yes. By 2022 the winning-bid index on the 523-item basket stood 12.7% above the estimate index for the same items, with both set to 100 in 2017, and the median state-let construction job was won 5.4% over the estimate. It was the only year from 2017 to 2024 when the median job was won above the estimate."},{question:"How many bidders does a Texas DOT construction job draw?",answer:"State-let construction jobs drew 4.7 bidders on average from 2017 to 2024. The average fell from 5.1 in 2021 to 3.9 in 2022, and single-bid jobs rose from 3.7% to 6.0% of jobs."},{question:"What share of bid lines are never used?",answer:"13.4% of bid lines, about 1 in 7, were never used on 5,265 completed Texas DOT construction contracts. Only 39.1% ended at exactly the bid quantity."},{question:"How much do contracts change between award and final payment?",answer:"Final payments ran 5.0% above award value on 5,265 completed construction contracts, but 12.8% of contract value moved across four payment categories, and 26.1% when each item is counted separately. New item types that were not in the bid added 7.5%, and 78% of jobs gained at least one."},{question:"How much of a Texas road job is environmental work?",answer:"Environmental items are on 81% of completed construction contracts and take a median 1.0% of final cost, or 1.6% of all construction dollars. Erosion control is on 79% of jobs and is typically paid 56% of its bid value."},{question:"How much does contamination cost compared with its bid?",answer:"Hazardous material items were bid at $1.3m in priced items and paid $35.4m on completed Texas DOT construction contract
