 at least 15 winning-bid prices in every year, with lump sums left out because they scale with job size. Each item is weighted by the dollars bid on it. Indexed to 2017 as 100, winning bid prices reached 168.3 in 2024, a rise of 68%. The engineer's estimate for the same items reached 170.0."}),l.jsx(tn,{children:l.jsx(Mn,{n:1,title:"Winning bids and engineer's estimates on the same 523 items, 2017 = 100",takeaway:"Winning bids jumped in 2022 and the estimates followed in 2023.",source:"Mastt analysis of public contract records, Texas DOT, 2017 to 2024.",note:"Median unit prices per item and year, combined as a dollar-weighted geometric mean.",children:l.jsx(Hk,{})})}),l.jsx("p",{children:"The path was not smooth. Prices dipped in 2018, rose to 109.0 in 2019 and held between 107 and 109 through 2021. Winning bids then jumped 23.4% in 2022 and a further 17.0% in 2023. Estimates rose 11.6% in 2022 and 27.1% in 2023. The two series crossed in 2024, when estimates sat 1.0% above winning bids. A smaller version of the same pattern showed in 2019, when winning bids ran 9.7% ahead of the estimate index before the gap closed the following year."}),l.jsxs(Sa,{title:"How do these prices compare with national indices?",children:[l.jsxs("p",{children:["The Federal Highway Administration (FHWA) publishes the ",l.jsx(ei,{href:"https://www.fhwa.dot.gov/policy/otps/nhcci/methodology.cfm",children:"National Highway Construction Cost Index"})," (NHCCI), built from the winning bids that states post online and calculated as a chained Fisher index. On annual averages the NHCCI rose 93% from 2017 to 2024 and 26.3% in 2022 alone, close to the 23.4% rise in the Texas basket that year. The two are built differently, so they are not expected to match, and the Texas basket rose by less over the full period."]}),l.jsxs("p",{children:["The US Bureau of Labor Statistics (BLS) ",l.jsx(ei,{href:"https://fred.stlouisfed.org/series/WPUIP231231",children:"producer price index for inputs to highway and street construction"})," rose 46% over the same years. It tracks the prices of inputs to highway and street construction and excludes labour, capital investment and imports. It rose 17.2% in 2021 and 16.1% in 2022 on annual averages, then 0.3% in 2023 and 0.5% in 2024. Texas winning bids barely moved in 2021 (+0.5%) and rose in 2022 and 2023, which points to bid prices following input costs by about a year."]})]}),l.jsx(tn,{children:l.jsx(Mn,{n:2,title:"Texas winning bids against two national indices, 2017 = 100",takeaway:"Input costs moved first, Texas bids followed a year later, and the national bid index rose furthest.",source:"Mastt analysis of public contract records, Texas DOT; FHWA National Highway Construction Cost Index; BLS Producer Price Index, inputs to highways and streets.",note:"National series are annual averages rebased to 2017.",children:l.jsx(Fc,{label:"Texas winning bids, NHCCI and BLS highway input index, 2017 = 100",categoryLabel:"Year",height:300,series:[{key:"bid",label:"Texas winning bids"},{key:"nhcci",label:"NHCCI (national bids)",dashed:!0,area:!1},{key:"bls",label:"BLS highway inputs",area:!1}],data:Nk.map(t=>({...Zc(t.year),values:{bid:t.bid,nhcci:t.nhcci,bls:t.bls}})),formatValue:t=>t.toFixed(1)})})}),l.jsxs(bi,{children:[l.jsxs("p",{children:["Choose an escalation index that matches the work you are buying, then test it against your own last few tenders. In Australia the ABS producer price indexes play the same role. The ",l.jsx(ei,{href:"https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/producer-price-indexes-australia/jun-2026",children:"June quarter 2026 release"})," showed heavy and civil engineering construction prices up 3.6% over twelve months, with road and bridge construction up 4.5% in the quarter on higher bitumen and diesel prices."]}),l.jsx("p",{children:"A basket of the items you buy most is a better guide than a general inflation rate, because input prices and bid prices can move a year apart."})]})]}),l.jsxs(vi,{id:"ahead",title:"Did winning bids run ahead of the engineer's estimate in 2022?",children:[l.jsx("p",{children:"Yes. For state-let construction jobs, the median winning bid was 4.7% under the estimate in 2021 and 5.4% over it in 2022. It was the only year in the series when the median winning bid finished above the estimate. Across 2017 to 2024 the yearly median ran between 7.5% under and 5.4% over."}),l.jsx(tn,{children:l.jsx(Mn,{n:3,title:"Median winning bid as a percentage of the engineer's estimate, by year",takeaway:"Winning bids usually come in under the estimate. In 2022 the median crossed 100.",source:"Mastt analysis of public contract records, Texas DOT, 2017 to 2024.",note:"Low bid divided by the engineer's estimate for each letting, median by year of letting.",children:l.jsx(Gk,{})})}),l.jsxs("p",{children:["The flip shows up across the distribution. In 2022 59.9% of state-let construction jobs were won above the estimate, against 26% to 48% in the other years. Nearly one job in four (22.6%) was won at least 20% above, against 4.8% to 14.8% in other years. That 20% line matters to owners, because the Texas DOT design manual calls for a ",l.jsx(ei,{href:"https://www.txdot.gov/manuals/des/pse/chapter-8--post-letting-guidelines/section-2--letting-overrun-underrun-justification.html",children:"written justification"})," when the apparent low bid is 20% or more over or under the estimate and there are two or more bidders. With only one bidder, the trigger is a bid more than 10% either side of the estimate."]}),l.jsx(bi,{children:l.jsx("p",{children:"Track the share of your tenders won 20% or more over the estimate, not only the average. In 2022 that share reached 22.6% of Texas DOT state-let construction jobs, against 4.8% to 14.8% in other years. Set the review trigger before bids open and record the reason for each large variance, as the Texas DOT manual requires."})})]}),l.jsxs(vi,{id:"bidders",title:"Did fewer bidders push prices up?",children:[l.jsx("p",{children:"Competition thinned in 2022. Bidders per state-let construction job fell from 5.1 in 2021 to 3.9 in 2022 and 3.7 in 2023, against about 5.1 a job over 2017 to 2021. Single-bid jobs rose from 3.7% of jobs in 2021 to 6.0% in 2022 and 6.7% in 2023, roughly double their 3.2% average over 2017 to 2021. Bidders recovered to 4.4 a job in 2024."}),l.jsx(tn,{children:l.jsx(Mn,{n:4,title:"Bidders per job and single-bid share, by year",takeaway:"Bidders fell and single-bid jobs rose together in 2022 and 2023.",source:"Mastt analysis of public contract records, Texas DOT, state-let construction lettings, 2017 to 2024.",children:l.jsx(Yk,{})})}),l.jsx("p",{children:"Competition and price move together across the whole period. Jobs with one bidder were won at a median 17.6% over the estimate. Jobs with two bidders were won at 5.3% over. From three bidders the median sits under the estimate, at 0.8% under with three, 3.7% under with four, 5.9% under with five and 9.1% under with six or more."}),l.jsx(tn,{children:l.jsxs(Mn,{n:5,title:"Median winning bid as a percentage of the estimate, by number of bidders",takeaway:"One bidder meant a median 17.6% over the estimate. Six or more meant 9.1% under.",source:"Mastt analysis of public contract records, Texas DOT, 5,912 state-let construction lettings, 2017 to 2024.",note:"Lettings with six or more bidders are grouped.",children:[l.jsx(Sw,{label:"Median bid as % of estimate, by bidders",period:"2017 to 2024, state-let construction lettings",unit:"%",averageLabel:"Average of the six groups",showAverage:!1,valueLabel:"Median winning bid, % of estimate",categoryLabel:"Bidders",height:220,data:i1.map(t=>({key:String(t.bidders),label:`${t.label} bidder${t.bidders===1?"":"s"} (${t.n.toLocaleString("en-US")} jobs)`,axisLabel:t.bidders===6?"6+":String(t.bidders),value:t.medianPct})),formatValue:t=>Number.isInteger(t)?String(t):t.toFixed(1)}),l.jsxs("p",{style:Au,children:["Median as % of estimate: ",i1.map(t=>`${t.label} bidders ${t.medianPct.toFixed(1)}%`).join(", "),"."]})]})}),l.jsx("p",{children:"These are associations across jobs, not proof that bidder numbers set the price. Larger and more complex jobs draw fewer bidders and also price higher. The 2022 pattern is still consistent with contractors having less room or less appetite to bid that year, although public records cannot show why."}),l.jsx(bi,{children:l.jsx("p",{children:"If you expect one or two bidders, plan for a winning bid 5% to 18% above your estimate. Ask how many bidders your last three tenders drew before you trust an estimate built from older prices."})})]}),l.jsxs(vi,{id:"catch-up",title:"How long did estimates take to catch up?",children:[l.jsxs("p",{children:["About a year. Estimates built from historical bid data trail a moving market. On the Texas basket the gap between winning bids and estimates was 12.7% in 2022, 3.7% in 2023 and -1.0% in 2024. FHWA's ",l.jsx(ei,{href:"https://www.fhwa.dot.gov/construction/contracts/2014cost.pdf",children:"2015 national review of state cost estimation practice"})," described the same mechanism in the opposite direction. It records that during the 2008 to 2010 downturn a nationwide pattern of lower bids left them 10% to 30% below state engineer's estimates, and says the estimates lagged market conditions."]}),l.jsxs("p",{children:["Estimate accuracy is a long-running concern. FHWA's guidance says an estimate should be within 10% of the low bid for at least half of projects, and the 2015 review found 48% of 1,611 projects within that band nationally. Texas DOT's own ",l.jsx(ei,{href:"https://ftp.txdot.gov/pub/txdot-info/aud/reports/Plan_Review_and_Bid_Estimation_Effectiveness_Final_Internal_Audit_Report.pdf",children:"internal audit of plan review and bid estimation"})," tested 842 completed projects in eight districts it selected, let from 2016 to August 2020. It found the yearly average for the combined districts ranged from 42% to 53% against the 50% goal. Mastt's records for state-let construction jobs in every district show 45% to 53% within 10% across 2017 to 2020 and 41.6% across 2023 and 2024 (1,585 lettings), in line with the audit and a little lower in the latest years."]}),l.jsxs("p",{children:["The ",l.jsx(ei,{href:"https://www.oversight.gov/reports/audit/fhwa-lacks-adequate-oversight-and-guidance-engineers-estimates",children:"US Department of Transportation Inspector General"})," found in 2019 that FHWA lacked adequate guidance and processes to oversee the accuracy of engineer's estimates, so how closely estimates track bids is a national question as well as a Texas one."]}),l.jsx(Sa,{title:"Can a price-history model do better?",children:l.jsx("p",{children:"Mastt tested a simple model that priced each 2023 and 2024 state-let construction letting from the median winning price of every item over the previous 12 months, using only data that existed before the letting. Across 1,585 lettings its median miss against the winning bid was 16.7%, against 12.8% for the engineer's estimate. It came closer than the engineer on 38.4% of lettings. A 50/50 blend of the two missed by 13.4%, no better than the estimate alone."})}),l.jsx(tn,{children:l.jsx(Tl,{title:"Median miss against the winning bid",description:"State-let construction lettings, 2023 to 2024.",stats:[{value:12.8,decimals:1,suffix:"%",label:"Engineer's estimate",detail:"1,585 lettings"},{value:16.7,decimals:1,suffix:"%",label:"Price-history model",detail:"Closer than the estimate on 38.4% of lettings"},{value:13.4,decimals:1,suffix:"%",label:"50/50 blend",detail:"No better than the estimate alone"}]})}),l.jsx("p",{children:"That suggests item averages carry price history but not project context such as location, staging, traffic and site conditions. Any estimating model has to beat 12.8% and will need project information to do it."}),l.jsx(bi,{children:l.jsx("p",{children:"When prices are rising, estimates built on last year's bids will be low. Add escalation to the estimate in the quarter prices start to move, then compare it with the latest bids rather than waiting for the next scheduled review."})})]}),l.jsxs(vi,{id:"quantities",title:"How often are bid quantities right?",children:[l.jsx("p",{children:"Prices are half of contract value and quantities are the other half. Mastt joined 341,637 bid lines on 5,265 completed Texas DOT construction contracts to the quantity finally paid on each line. One in seven bid items (13.4%) was never used, and only 39.1% ended at exactly the bid quantity. Counting the unused lines, 30.6% underran by more than 10%, and 17.6% overran by more than 10%. The remaining 12.8% finished within 10% of the bid quantity without matching it."}),l.jsx(tn,{children:l.jsx(Mn,{n:6,title:"How bid lines ended, completed Texas DOT construction contracts",takeaway:"Fewer than two lines in five finished at the bid quantity.",source:"Mastt analysis of public contract records, Texas DOT, 341,637 bid lines on 5,265 completed construction contracts let 2015 to 2024.",note:"Each cell is 1% of bid lines.",children:l.jsx(_R,{label:"How bid lines ended against the bid quantity",unit:"% of bid lines",accentKey:"never",legend:!0,decimals:1,formatValue:t=>`${t.toFixed(1)}%`,data:Pk.map(t=>{var e;return{key:t,label:qk[t]??t,value:((e=Dk.find(n=>n.key===t))==null?void 0:e.share)??0}})})})}),l.jsx(Sa,{title:"Which items are most over-quantified?",children:l.jsx("p",{children:"Padding sits in temporary and support items. Vegetative watering went unused on 58% of the jobs that bid it, and the typical bid line for it was paid nothing. Construction exits and temporary seeding were never used on 59% and 54% of the lines that bid them. As a group, the erosion and sediment control items under Item 506 used a median 40% of bid quantity, and the erosion-control seeding items under Item 164 used 43%. Rock filter dams on their own used a median 36%. Silt fence used a median 67%, the highest in the table below."})}),l.jsx(tn,{children:l.jsx(Mn,{n:7,title:"Most over-quantified items, ranked by median share of bid quantity used",takeaway:"Watering, construction exits and temporary seeding are typically paid nothing.",source:"Mastt analysis of public contract records, Texas DOT, 341,637 bid lines on completed construction contracts let 2015 to 2024.",note:"Items with at least 300 bid lines. Median share is quantity paid divided by bid quantity, per line. Click a column to sort.",children:l.jsx(Uf,{rowKey:"item",caption:"Share of bid quantity used, by item",defaultSort:{key:"medianUsed",direction:"asc"},columns:[{key:"item",label:"Item"},{key:"lines",label:"Bid lines",numeric:!0,render:t=>l.jsxs(l.Fragment,{children:[t.toLocaleString("en-US"),An("bid lines")]})},{key:"never",label:"Never used",numeric:!0,render:t=>l.jsxs(l.Fragment,{children:[`${t}%`,An("never used")]})},{key:"medianUsed",label:"Median share used",numeric:!0,render:t=>l.jsxs(l.Fragment,{children:[`${t}%`,An("of bid quantity used")]})}],rows:kk})})}),l.jsxs("p",{children:["A likely reason is that these quantities depend on weather, staging and how the contractor works, so designers bid generous amounts. Owners pay only for what goes in, so padding costs nothing at payment. It can still distort bid comparison and hide how much is installed, and it may escape review. The ",l.jsx(ei,{href:"https://www.txdot.gov/manuals/cst/cah/changes_to_the_contract/change_orders-ceghciif.html",children:"Texas DOT contract administration handbook"})," ties its change-order checks to major items, defined as items worth at least 5% of the original contract or $100,000, whichever is less, that move more than 25% from the bid quantity. Erosion control is a median 0.3% of a contract's final cost, so on a typical job its lines fall below that test."]}),l.jsx(bi,{children:l.jsx("p",{children:"Check temporary and erosion-control quantities before you go to tender, using paid quantities from your last jobs rather than the design allowance. When you compare bids, look at unit prices on the padded items as well as the totals."})})]}),l.jsxs(vi,{id:"change",title:"Where does the money move between award and final payment?",children:[l.jsx("p",{children:"The net change on a completed contract hides far more movement than it shows. For 5,266 completed Texas DOT construction contracts, with $30.2bn awarded, final payments ran 5.0% above award value. Underneath, items in the original bid were paid 3.9% below award value, and item types that bidders never priced added 7.5%. Price and payment adjustments added 0.8% and force account work added 0.6%. Gross movement was 12.8%, about 13%, against a net 5.0%."}),l.jsx(tn,{children:l.jsx(Mn,{n:8,title:"What moved underneath the 5.0% net change, as a share of award value",takeaway:"New item types were the largest piece of movement.",source:"Mastt analysis of public contract records, Texas DOT, 5,266 completed construction contracts let 2015 to 2024, $30.2bn awarded.",note:"The first figure in each row is a percentage of award value and the second is its share of the 12.8% gross movement. Net change is +5.0% (7.5 + 0.8 + 0.6 - 3.9).",children:l.jsx(zf,{label:"Gross movement in contract value by source, as a percentage of award value",totalLabel:"Gross movement",legend:!0,size:240,formatValue:t=>ar(t),data:Ok.map(t=>({key:t.key,label:t.label,value:t.value}))})})}),l.jsx(V8,{items:[{label:"Net change in final cost",value:5,suffix:"%",context:"Final payments against award value, $30.2bn awarded"},{label:"Gross movement between lines",value:13,suffix:"%",context:"12.8% of award value, counting additions and reductions"},{label:"Jobs with a new item type",value:77,suffix:"%",context:"At least one item added after award that bidders never priced"}]}),l.jsx("p",{children:"New item types added $2.27bn across the 5,266 contracts. Ordinary items that were missing from the bid made up $1.46bn of that. The rest ran through placeholder codes, used for work with no standard item. Generic change order lines added $588m across 2,318 jobs, and police traffic control, the largest single line, was paid $152m across 2,510 jobs. Other placeholder lines made up about $75m."}),l.jsx(bi,{children:l.jsx("p",{children:"A change register that shows only the net figure hides most of the work your team managed. Report gross additions and reductions as well, and carry an allowance for the lines you know will arrive, such as police traffic control."})})]}),l.jsxs(vi,{id:"size-district",title:"Do bigger jobs and some districts change more?",children:[l.jsx("p",{children:"Yes to both. On 9,979 completed construction contracts, median cost growth rises from -0.3% on jobs under $100k to +5.2% on jobs over $20m. 79% of jobs over $20m were given extra days, against 8% of jobs under $100k. The median daily late penalty (liquidated damages) rises from $570 to $2,590 across the same bands."}),l.jsx("p",{children:"Across 25 Texas DOT districts working under the same owner, rules and contracts, median cost growth runs from +5.3% in Houston to -0.5% in Lufkin. The share of jobs charged late penalties runs from 13% in Odessa to 39% in San Angelo. Work mix and local markets may explain part of that spread, and the rest points to local practice."}),l.jsx(tn,{children:l.jsx(Mn,{n:9,title:"Cost growth, extra days and late penalties, by job size and by district",takeaway:"Median cost growth climbs with job size, and district results spread widely.",source:"Mastt analysis of public contract records, Texas DOT, 9,979 completed construction contracts awarded 2003 to 2026.",note:"Cost growth is final item earnings against award amount. The under $100k band has 101 jobs.",children:l.jsxs(e1,{defaultValue:"size",children:[l.jsxs(n1,{"aria-label":"Breakdown",children:[l.jsx($l,{value:"size",children:"By job size"}),l.jsx($l,{value:"district",children:"By district"})]}),l.jsx(Vl,{value:"size",children:l.jsx(Uf,{rowKey:"band",caption:"Completed construction contracts by award size",columns:[{key:"band",label:"Award size",sortable:!1,width:150},{key:"jobs",label:"Jobs",numeric:!0,render:t=>l.jsxs(l.Fragment,{children:[t.toLocaleString("en-US"),An("jobs")]})},{key:"growth",label:"Median cost growth",numeric:!0,render:t=>l.jsxs(l.Fragment,{children:[`${t>0?"+":""}${t}%`,An("growth")]})},{key:"extra",label:"Given extra days",numeric:!0,render:t=>l.jsxs(l.Fragment,{children:[`${t}%`,An("extra days")]})},{key:"late",label:"Charged late penalties",numeric:!0,render:t=>l.jsxs(l.Fragment,{children:[`${t}%`,An("late penalties")]})},{key:"rate",label:"Median daily penalty",numeric:!0,render:t=>l.jsxs(l.Fragment,{children:[`$${t.toLocaleString("en-US")}`,An("a day")]})}],rows:Lk})}),l.jsx(Vl,{value:"district",children:l.jsx(Uf,{rowKey:"district",caption:"Completed construction contracts by district",defaultSort:{key:"growth",direction:"desc"},columns:[{key:"district",label:"District"},{key:"jobs",label:"Jobs",numeric:!0,render:t=>l.jsxs(l.Fragment,{children:[t.toLocaleString("en-US"),An("jobs")]})},{key:"growth",label:"Median cost growth",numeric:!0,render:t=>l.jsxs(l.Fragment,{children:[`${t>0?"+":""}${t}%`,An("growth")]})},{key:"late",label:"Charged late penalties",numeric:!0,render:t=>l.jsxs(l.Fragment,{children:[`${t}%`,An("late penalties")]})},{key:"extra",label:"Given extra days",numeric:!0,render:t=>l.jsxs(l.Fragment,{children:[`${t}%`,An("extra days")]})}],rows:$k})})]})})}),l.jsx(bi,{children:l.jsx("p",{children:"Set contingency by job size. A flat percentage is too much for small jobs and too little for large ones. Compare like with like when you benchmark a delivery team, because a statewide average hides large regional differences."})})]}),l.jsxs(vi,{id:"environment",title:"What do environmental items cost, and what happens to them after award?",children:[l.jsxs("p",{children:["Environmental line items are the controls and mitigation work on a road job, such as erosion and sediment control, revegetation, hazardous material handling and noise walls. Texas requires a stormwater pollution prevention plan for construction sites that disturb an acre or more of soil and discharge stormwater to surface water, under the ",l.jsx(ei,{href:"https://www.tceq.texas.gov/permitting/stormwater/construction/index",children:"construction general permit"})," renewed with effect from 5 March 2023, so most road jobs carry these items."]}),l.jsx("p",{children:"Environmental items appear on 81% of 9,018 completed Texas DOT construction contracts, yet they take a median 1.0% of final cost and 1.6% of all construction dollars, $0.77bn of $48.9bn. Erosion control is on 79% of jobs and revegetation on 62%. Mitigation is on 5.4% and hazardous items on 1.1%. Only 11% of maintenance contracts have any."}),l.jsx(tn,{children:l.jsx(Mn,{n:10,title:"Environmental dollars paid by type, completed construction contracts",takeaway:"Planting, soil and seeding take the most, and noise walls are the largest single mitigation line.",source:"Mastt analysis of public contract records, Texas DOT, 9,018 completed construction contracts awarded 2004 to 2026.",note:"Dollars paid, in millions, nominal. Click a tile to zoom in.",children:l.jsx(mD,{label:"Environmental dollars paid by category and type",data:Uk,height:380,formatValue:t=>a1(t)})})}),l.jsxs(Sa,{title:"Erosion control is paid at about half its bid",children:[l.jsx("p",{children:"Across 7,074 jobs with erosion and sediment control bid items, the typical job was paid 56% of the bid value. One job in five (20%) was paid nothing for them. Weighted by dollars the underrun is 26%. Revegetation underruns less, with a typical 73% paid. The whole contract still lands near +2%, a median 1.8% growth across the 9,018 jobs, as other items make up the gap."}),l.jsx(tn,{children:l.jsx(Mn,{n:11,title:"Paid as a share of bid value per job, erosion control and revegetation",takeaway:"One erosion control job in five was paid nothing, and one in six was paid more than 105% of its bid.",source:"Mastt analysis of public contract records, Texas DOT, 7,074 jobs with erosion control items and 5,532 with revegetation items, contracts awarded 2004 to 2026.",note:"Each job is one observation. Value paid is divided by bid value for the category on that job.",children:l.jsxs(e1,{defaultValue:"esc",children:[l.jsxs(n1,{"aria-label":"Category",children:[l.jsx($l,{value:"esc",children:"Erosion and sediment control"}),l.jsx($l,{value:"rev",children:"Revegetation"})]}),l.jsx(Vl,{value:"esc",children:l.jsx(zf,{label:"Erosion and sediment control jobs by paid-to-bid ratio",totalLabel:"Share of jobs",legend:!0,size:240,formatValue:t=>ar(t),data:Vk.map((t,e)=>({key:`e${e}`,label:t.label,value:t.share}))})}),l.jsx(Vl,{value:"rev",children:l.jsx(zf,{label:"Revegetation jobs by paid-to-bid ratio",totalLabel:"Share of jobs",legend:!0,size:240,formatValue:t=>ar(t),data:zk.map((t,e)=>({key:`r${e}`,label:t.label,value:t.share}))})})]})})})]}),l.jsxs(Sa,{title:"Contamination is found during the job, not bid before it",children:[l.jsx("p",{children:"Asbestos, lead paint and contaminated soil tend to be found once work starts. Hazardous items appear on 1.1% of construction jobs, yet the money is large when they do. They were bid at $1.3m and paid $35.4m, about 27 times the bid. $32.4m of that (92%) arrived through force account and unique change order lines rather than bid items, which suggests the work was not known at tender. Contaminated soil and groundwater was the largest category at $20.9m."}),l.jsx(tn,{children:l.jsx(Mn,{n:12,title:"Bid against paid, by environmental category",takeaway:"Erosion control and revegetation underran, mitigation ran 11% over, and hazardous items rose from $1.3m to $35.4m.",source:"Mastt analysis of public contract records, Texas DOT, 9,018 completed construction contracts awarded 2004 to 2026.",note:"Dollars in millions, nominal. Paid includes lines added after award. Mitigation was paid at 1.11 times its bid value, and noise walls are its largest line.",children:l.jsx(tN,{label:"Environmental items, bid value against value paid, in millions of dollars",startLabel:"Bid",endLabel:"Paid",highlightKey:"HAZ",formatValue:a1,data:Bk.map(t=>({key:t.key,label:t.label,start:t.bid,end:t.paid}))})})}),l.jsx(tn,{children:l.jsx(Tl,{title:"Hazardous items",description:"Bid against paid, completed construction contracts.",stats:[{value:1.3,decimals:1,prefix:"$",suffix:"m",label:"Bid",detail:"Original bid lines"},{value:35.4,decimals:1,prefix:"$",suffix:"m",label:"Paid",detail:"On the 100 jobs with hazardous items"},{value:92,suffix:"%",label:"Paid through force accounts",detail:"Not through bid items"}]})}),l.jsxs("p",{children:["Asbestos can be surveyed before tender. The US rule on ",l.jsx(ei,{href:"https://www.law.cornell.edu/cfr/text/40/61.145",children:"demolition and renovation"})," requires an owner or operator to thoroughly inspect the affected facility for asbestos before demolition or renovation, so part of that exposure can be found and priced early. Contaminated soil and groundwater can be harder to see from the surface."]})]}),l.jsx(Sa,{title:"Change orders add environmental work nobody bid",children:l.jsx("p",{children:"11% of construction jobs added environmental lines by change order, worth $64.2m. A further $65.2m was paid through force account and unique change order lines. That is about $129m of environmental work added after award across 9,018 jobs. Revegetation made up $40.0m of the change order lines and noise walls and other mitigation $14.6m."})}),l.jsxs(Sa,{title:"Do winning bidders game environmental items?",children:[l.jsx("p",{children:"Erosion items underrun so often that a bid reviewer might expect winners to price them low. The records do not show it. Across 26,720 environmental items on 3,632 jobs, the winner's unit price was a median 1.00 times the estimate, against 1.01 for all other items. Within the same job the difference is not statistically significant (p = 0.3). The underrun looks like padding in the quantities rather than a bidding tactic."}),l.jsx(tn,{children:l.jsx(Tl,{title:"Winner's price against the estimate",description:"Median unit price ratio, 2016 to 2024 lettings.",stats:[{value:1,decimals:2,label:"Environmental items",detail:"26,720 items on 3,632 jobs"},{value:1.01,decimals:2,label:"All other items",detail:"256,737 items"},{value:.99,decimals:2,label:"Within the same job",detail:"Environmental against other items, not significant"}]})}),l.jsx("p",{children:"One caution applies. Weighted by dollars, winners priced environmental items at 0.86 of the estimate and other items at 0.97, so the check does not rule out pricing on a few large items. On the median, which describes the typical line, there is no sign of it."})]}),l.jsx(bi,{children:l.jsx("p",{children:"Budget about 1% of cost for environmental controls and watch the exceptions. Pay for what goes in and check it stays maintained. Carry a contingency for contamination, because a bid line will not cover it. Track environmental change as its own category, so it does not disappear inside the net."})})]}),l.jsxs(vi,{id:"contingency",title:"What does this mean for contingency and escalation?",children:[l.jsx("p",{children:"The Texas records point to four separate sources of movement, and a budget needs a different answer to each."}),l.jsxs("p",{children:[l.jsx("b",{children:"Price escalation."})," Bid prices rose 23.4% in 2022 and 17.0% in 2023 on the Texas basket, and estimates took about a year to follow. A budget set during a price surge goes stale quickly. Add escalation in the quarter prices begin to move, and check the budget against the latest bids instead of last year's."]}),l.jsxs("p",{children:[l.jsx("b",{children:"Competition."})," Jobs with one or two bidders were won at a median 5% to 18% over the estimate. When tender interest is thin, treat the estimate as the lower bound and hold the premium in contingency."]}),l.jsxs("p",{children:[l.jsx("b",{children:"Quantity and scope movement."})," A 5.0% net change hid 12.8% gross movement, and 77% of jobs gained at least one item that was not in the tender. Hold contingency for gross movement, not only the net outcome, and scale it by job size. Median growth runs from -0.3% under $100k to +5.2% over $20m."]}),l.jsxs("p",{children:[l.jsx("b",{children:"Known unknowns."})," Police traffic control, contamination and environmental change orders recur across Texas DOT jobs. Carry them as named allowances, which keeps general contingency for risks no one has priced yet."]}),l.jsx(z8,{children:"Across completed Texas DOT construction contracts, a 5% net change hid 13% of contract value moving between lines."}),l.jsx(bi,{title:"What this means for project teams",children:l.jsxs("ul",{children:[l.jsx("li",{children:"Set escalation from an index you can name, then test it against your own last tenders."}),l.jsx("li",{children:"Expect a premium of 5% to 18% when only one or two firms bid."}),l.jsx("li",{children:"Hold contingency against gross movement and scale it by job size."}),l.jsx("li",{children:"Carry allowances for traffic control, contamination and environmental change."}),l.jsx("li",{children:"Report gross additions and reductions next to the net figure."})]})})]}),l.jsx(B8,{items:[{question:"How much did Texas DOT bid prices rise from 2017 to 2024?",answer:"A fixed basket of 523 Texas DOT bid items rose 68% between 2017 and 2024, from an index of 100 to 168.3 in winning bid prices. The engineer's estimate for the same items rose 70%, to 170.0."},{question:"Did winning bids come in above the engineer's estimate in 2022?",answer:"On the 523-item basket winning bids ran 12.7% ahead of the estimates in 2022, and the median state-let construction job was won 5.4% over the estimate. It was the only year from 2017 to 2024 when the median finished above the estimate."},{question:"How many bidders does a Texas DOT construction job draw?",answer:"State-let construction jobs drew 4.7 bidders on average from 2017 to 2024. The average fell from 5.1 in 2021 to 3.9 in 2022, and single-bid jobs rose from 3.7% to 6.0% of jobs."},{question:"What share of bid items are never used?",answer:"13.4% of bid lines, about 1 in 7, were never used on 5,265 completed Texas DOT construction contracts. Only 39.1% ended at exactly the bid quantity."},{question:"How much do contracts change between award and final payment?",answer:"Final payments ran 5.0% above award value on 5,266 completed construction contracts, but 12.8% of contract value moved between lines. New item types that bidders never priced added 7.5%, and 77% of jobs gained at least one."},{question:"How much of a Texas road job is environmental work?",answer:"Environmental items are on 81% of completed construction contracts and take a median 1.0% of final cost, or 1.6% of all construction dollars. Erosion control is on 79% of jobs and is typically paid 56% of its bid value."},{question:"How much does contamination cost compared with its bid?",answer:"Hazardous material items were bid at $1.3m and paid $35.4m on completed Texas DOT construction contracts, about 27 times the bid. 92% of the money arrived through force account lines, not bid items."}]}),l.jsx(U8,{items:[{title:"Plan Review and Bid Estimation Effectiveness, Final Internal Audit Report",publisher:"Texas Department of Transportation, Internal Audit Division",date:"July 2021",url:"https://ftp.txdot.gov/pub/txdot-info/aud/reports/Plan_Review_and_Bid_Estimation_Effectiveness_Final_Internal_Audit_Report.pdf"},{title:"National Highway Construction Cost Index (NHCCI) methodology",publisher:"Federal Highway Administration",url:"https://www.fhwa.dot.gov/policy/otps/nhcci/methodology.cfm"},{title:"NHCCI quarterly data",publisher:"Federal Highway Administration, via Data.gov",date:"updated September 2026",url:"https://catalog.data.gov/dataset/nhcci"},{title:"Producer Price Index by Commodity, Net Inputs to Highways and Streets (WPUIP231231)",publisher:"US Bureau of Labor Statistics, via FRED",date:"updated September 2026",url:"https://fred.stlouisfed.org/series/WPUIP231231"},{title:"8.2 Letting Overrun/Underrun Justification",publisher:"Texas Department of Transportation, Design Manual",url:"https://www.txdot.gov/manuals/des/pse/chapter-8--post-letting-guidelines/section-2--letting-overrun-underrun-justification.html"},{title:"National Review of State Cost Estimation Practice, Final Report",publisher:"Federal Highway Administration",date:"February 2015",url:"https://www.fhwa.dot.gov/construction/contracts/2014cost.pdf"},{title:"FHWA Lacks Adequate Oversight and Guidance for Engineer's Estimates (ST2019020)",publisher:"US Department of Transportation, Office of Inspector General",date:"13 March 2019",url:"https://www.oversight.gov/reports/audit/fhwa-lacks-adequate-oversight-and-guidance-engineers-estimates"},{title:"Change Orders, Construction Contract Administration Handbook",publisher:"Texas Department of Transportation",url:"https://www.txdot.gov/manuals/cst/cah/changes_to_the_contract/change_orders-ceghciif.html"},{title:"Stormwater General Permit for Construction Activities (TXR150000)",publisher:"Texas Commission on Environmental Quality",url:"https://www.tceq.texas.gov/permitting/stormwater/construction/index"},{title:"40 CFR 61.145, Standard for demolition and renovation",publisher:"US Environmental Protection Agency, via the Cornell Legal Information Institute",url:"https://www.law.cornell.edu/cfr/text/40/61.145"},{title:"Producer Price Indexes, Australia, June 2026",publisher:"Australian Bureau of Statistics",date:"31 July 2026",url:"https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/producer-price-indexes-australia/jun-2026"}],methodology:l.jsxs(l.Fragment,{children:[l.jsx("p",{children:"Our own figures come from Mastt's analysis of public Texas DOT contract records. The price index starts from the unit prices on about 13,700 lettings from 2017 to 2024. It holds a fixed basket of 523 items priced per unit, each with at least 15 winning-bid prices in every year, which together appear on about 10,800 lettings. It combines each item's yearly median winning and estimated price with weights based on the dollars bid. The letting comparisons use 5,912 state-let construction lettings, with the low bid compared against the engineer's estimate, and the all-lettings view adds maintenance and local lettings."}),l.jsx("p",{children:"Post-award figures link each bid line to the quantity finally paid. They cover 341,637 bid lines on 5,265 completed construction contracts let from 2015 to 2024, 5,266 completed contracts from the same lettings with $30.2bn awarded for the gross and net change, 9,979 completed contracts awarded from 2003 to 2026 for job size and district, and 9,018 completed construction contracts awarded from 2004 to 2026 for environmental items, built from more than 80,000 paid environmental lines. Environmental lines are tagged from item numbers and hand-reviewed descriptions. Dollars are nominal."}),l.jsx("p",{children:"These are signals, not proof. Texas figures describe Texas DOT work only. Recent contracts lean toward shorter jobs because long jobs are not final yet. Environmental work paid inside other items is not visible, and change orders classified from free text give a lower bound. National index values are annual averages of the published quarterly or monthly series, rebased to 2017. The Mastt model result is a test of a simple price-history approach on 2023 and 2024 lettings and does not describe any commercial estimating tool."}),l.jsx("p",{children:"Includes public sector information from Australian federal, state, territory and local governments, used under Creative Commons Attribution 4.0 licences."})]}),citeAs:"Mastt, Construction Bid Prices vs Engineer's Estimates: 2017 to 2024 Trends, mastt.com."})]})}c3.createRoot(document.getElementById("root")).render(l.jsx(p.StrictMode,{children:l.jsx(Xk,{})}));</script>
