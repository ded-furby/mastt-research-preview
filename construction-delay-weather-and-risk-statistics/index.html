s:[{value:47,suffix:"%",label:"Rain days with almost no rain",detail:"Texas DOT weather days with under a tenth of an inch at nearby gauges, on the day or the day before"},{value:12,suffix:"%",label:"Late penalties in the wettest and driest seasons",detail:"Share of Texas DOT working-day jobs charged late penalties in each group"},{value:13,suffix:"%",label:"Florida DOT overrun after adjustment",detail:"Down from 49% once weather and holiday days are removed, 431 contracts in the 2025-26 workbook"},{value:14,suffix:"%",label:"Risk registers listing contractor insolvency",detail:"9 of 64 public project risk registers"}]}),l.jsx(cM,{items:[l.jsxs(l.Fragment,{children:["On ",l.jsx("b",{children:"47%"})," of the 2,170 weekdays Texas DOT credited for rain, county gauges showed under a tenth of an inch on the day or the day before. ",l.jsx("b",{children:"32%"})," were fully dry, against 77% on ordinary charged weekdays."]}),l.jsxs(l.Fragment,{children:["Late penalties did not rise with wetter seasons. ",l.jsx("b",{children:"12%"})," of Texas DOT working-day jobs were charged penalties in both the driest and the wettest fifth of seasons, against 16% to 18% in the three fifths between."]}),l.jsxs(l.Fragment,{children:["Across 431 contracts in Florida DOT's 2025-26 workbook, days used ran ",l.jsx("b",{children:"49%"})," over plan, but ",l.jsx("b",{children:"13%"})," over once 32,701 weather days and 19,228 holiday days were removed."]}),l.jsxs(l.Fragment,{children:["About ",l.jsx("b",{children:"1 in 6"})," active Texas DOT jobs was past its allowed days, at 17.1% in January 2017 and 16.4% in November 2024. The median late penalty was ",l.jsx("b",{children:"$18,000"}),", or 0.7% of contract value."]}),l.jsxs(l.Fragment,{children:["Across 64 public risk registers, ",l.jsx("b",{children:"88%"})," list community risks, ",l.jsx("b",{children:"83%"})," approvals and ",l.jsx("b",{children:"75%"})," weather. Only ",l.jsx("b",{children:"14%"})," list contractor insolvency, ",l.jsx("b",{children:"5%"})," treat climate change as a risk and none mention cyber risk."]}),l.jsxs(l.Fragment,{children:["A public hospital bond program in Washington State published the same ",l.jsx("b",{children:"17 risks"})," in all six 2024 reports reviewed. None changed and none closed."]}),l.jsxs(l.Fragment,{children:["NYC school change orders took a median ",l.jsx("b",{children:"224 days"})," to approve. Thruway jobs took a median ",l.jsx("b",{children:"327 days"})," from letting to completion, and ",l.jsx("b",{children:"47%"})," of Victorian projects pushed back their finish date."]})]}),l.jsx(uM,{items:[{id:"weather-days",label:"Do weather days match the rain gauges?"},{id:"wet-seasons",label:"Do wetter seasons mean more late penalties?"},{id:"florida",label:"How much of Florida DOT's delay is weather and holidays?"},{id:"late-jobs",label:"How often are Texas DOT jobs late, and what do penalties cost?"},{id:"risk-registers",label:"What do public project risk registers cover?"},{id:"stale-register",label:"What does an unchanged risk register look like?"},{id:"approvals",label:"How long do approvals and delivery take?"},{id:"faq",label:"FAQs"},{id:"sources",label:"Sources and methodology"}]}),l.jsxs(gs,{id:"weather-days",title:"Do weather days match the rain gauges?",children:[l.jsx("p",{children:"Texas DOT records each working day on a road contract as charged or credited, with a reason for every credit. Mastt matched 2,170 weekdays credited for rain, wet ground or other precipitation against county rain gauge records for the same dates."}),l.jsxs("p",{children:["On ",l.jsx("b",{children:"47%"})," of those days, gauges showed under a tenth of an inch of rain on the day or the day before. On ",l.jsx("b",{children:"32%"})," they showed none at all. Over the same period, 85% of ordinary charged weekdays had under a tenth of an inch, so excused days were clearly wetter than normal days. A credited weekday was far more likely to follow rain than a charged one, with an odds ratio of 6.4."]}),l.jsxs(bf,{children:[l.jsx(sn,{n:1,title:"Rain at nearby gauges on days Texas DOT excused for rain",takeaway:"About half of excused days had a tenth of an inch or more. A third were fully dry.",source:"Mastt analysis of public contract records, Texas DOT daily time charges, and county rain gauge records. 2,170 credited weekdays, 1997 to 2026.",note:"Rain is the larger of the day and the day before.",wide:!1,children:l.jsx(yl,{label:"Rain on the day or the day before, days excused for rain",unit:"days",accentKey:"dry",decimals:1,formatValue:t=>`${Gl(t)} days`,data:[{key:"dry",label:"Fully dry (under 0.01 inch)",value:Ef.dry},{key:"light",label:"Light (0.01 to under 0.1 inch)",value:Ef.light},{key:"wet",label:"0.1 inch or more",value:Ef.wet}]})}),l.jsx(sn,{n:2,title:"Rain at nearby gauges on ordinary charged weekdays",takeaway:"Most charged days were dry, so excused days were clearly wetter.",source:"Mastt analysis of public contract records, Texas DOT daily time charges, and county rain gauge records. 82,628 charged weekdays, 1997 to 2026.",note:"Rain is the larger of the day and the day before.",wide:!1,children:l.jsx(yl,{label:"Rain on the day or the day before, ordinary charged weekdays",unit:"days",accentKey:"dry",decimals:1,formatValue:t=>`${Gl(t)} days`,data:[{key:"dry",label:"Fully dry (under 0.01 inch)",value:Cf.dry},{key:"light",label:"Light (0.01 to under 0.1 inch)",value:Cf.light},{key:"wet",label:"0.1 inch or more",value:Cf.wet}]})})]}),l.jsxs("p",{children:["This is a signal, not proof of misuse. County gauges can miss a patchy storm, and Mastt used the median of the gauges in each county, which can read zero on days when only part of a county gets rain. Site conditions can also lag rainfall. A paper on adverse-weather analysis for time extensions by ",l.jsx(ha,{href:"https://scholarscommons.fgcu.edu/esploro/outputs/journalArticle/Analysis-of-Adverse-Weather-for-Excusable/99383341611206570",children:"Nguyen and colleagues (Journal of Construction Engineering and Management, 2010)"})," lists lingering days and the definition of normal weather among seven factors that cause discrepancies. In Mastt's data, 26% of credited days had a tenth of an inch of rain two days earlier, against 9% of charged days."]}),l.jsxs("p",{children:["Contract wording shapes how many weather days exist. The ",l.jsx(ha,{href:"https://www.txdot.gov/manuals/cst/cah/prosecution_and_progress/contract_time-bceeiiih.html",children:"TxDOT contract administration handbook"})," says working day charges can be suspended only when work is suspended, and gives hazardous weather at the engineer's direction as one example. It also lists unsuitable weather or soil conditions as a reason work may be suspended while time charges may still apply. Weather does not stop the clock on its own. A decision to suspend work or credit a day has to be recorded."]}),l.jsxs("p",{children:["Other standard forms ask for other evidence. The AIA A201 General Conditions list adverse weather as a cause for extending the contract time only when it is documented with data showing conditions were abnormal for the period, under sections 8.3.1 and 15.1.6.2, as ",l.jsx(ha,{href:"https://www.bergersingerman.com/news-insights/what-you-need-to-know-about-construction-weather-delay-claims",children:"reproduced by Berger Singerman"}),". ",l.jsx(ha,{href:"https://holdingredlich.com/rain-rain-go-away-inclement-weather-in-construction-contracts",children:"Holding Redlich"})," notes that AS 4000 and AS 4902 give the contractor no weather relief in their standard form. Projects often amend them to allow an extension of time but not costs, and often require the weather event to be published by the Bureau of Meteorology."]}),l.jsx(vs,{children:l.jsx("p",{children:"Attach the nearest gauge reading, or a Bureau of Meteorology record on Australian jobs, to every weather-day entry when it is raised. Record the controlling activity affected and the date the entry was made. Review credited days against the readings each month, not at completion. Treat a gap between the entry and the record as a prompt to ask a question, not as grounds to refuse."})})]}),l.jsxs(gs,{id:"wet-seasons",title:"Do wetter seasons mean more late penalties?",children:[l.jsxs("p",{children:["If weather days work as intended, a wet season should stretch a job without costing the contractor. Mastt tested this on 7,178 Texas DOT working-day contracts awarded from 2014 to 2024. Each job was ranked against others awarded in the same year by how much wetter or drier its work window was than normal for the same dates in the same county, then split into fifths. The wettest fifth had about ",jk,"% more rain days than normal. The driest had about ",Tk,"% fewer."]}),l.jsxs("p",{children:["The result is flat at the extremes. ",l.jsx("b",{children:"12%"})," of jobs in the driest fifth were charged late penalties, and ",l.jsx("b",{children:"12%"})," in the wettest fifth. Average penalty days fell from 3.8 in the driest fifth to 3.0 in the wettest. The three middle fifths ran higher, at 16% to 18%, and Mastt could not explain that pattern from these records. Rain did not push penalties up in a straight line."]}),l.jsx(sn,{n:3,title:"Late penalties by how wet the season was",takeaway:"The driest and wettest fifths both sit at 12%. The middle fifths are higher.",source:"Mastt analysis of public contract records, Texas DOT, with county rain gauge records. Contracts awarded 2014 to 2024.",note:"Fifths are ranked within award year. Penalty days are trimmed at the 1st and 99th percentiles.",children:l.jsxs(Af,{defaultValue:"share",children:[l.jsxs(Mf,{children:[l.jsx(ma,{value:"share",children:"Working-day share"}),l.jsx(ma,{value:"avg",children:"Working-day penalty days"}),l.jsx(ma,{value:"cal",children:"Calendar-day share"})]}),l.jsx(pa,{value:"share",children:l.jsx(Qn,{label:"Share of working-day jobs charged late penalties",period:"7,178 working-day contracts, awarded 2014 to 2024",averageLabel:"Average of the five groups",valueLabel:"Charged penalties",categoryLabel:"Wetness fifth",showAverage:!1,formatValue:z1,data:kc.map((t,e)=>({key:`w${t.q}`,label:Qs[e].full,axisLabel:Qs[e].axis,value:Df(t.lateShare)}))})}),l.jsx(pa,{value:"avg",children:l.jsx(Qn,{label:"Average late penalty days per working-day job",period:"7,178 working-day contracts, awarded 2014 to 2024",averageLabel:"Average of the five groups",valueLabel:"Penalty days per job",categoryLabel:"Wetness fifth",showAverage:!1,formatValue:wk,data:kc.map((t,e)=>({key:`a${t.q}`,label:Qs[e].full,axisLabel:Qs[e].axis,value:Df(t.ldDays)}))})}),l.jsx(pa,{value:"cal",children:l.jsx(Qn,{label:"Share of calendar-day jobs charged late penalties",period:"4,310 calendar-day contracts, awarded 2014 to 2024",averageLabel:"Average of the five groups",valueLabel:"Charged penalties",categoryLabel:"Wetness fifth",showAverage:!1,formatValue:z1,data:_k.map((t,e)=>({key:`c${t.q}`,label:Qs[e].full,axisLabel:Qs[e].axis,value:Df(t.lateShare)}))})})]})}),l.jsx("p",{children:"Calendar-day contracts, which are almost all maintenance, behave differently because every calendar day counts. Between 1.4% and 2.1% of those jobs were charged penalties in each fifth, with no pattern by wetness. In a regression with controls for contract size, award year, district and work type, a wetter work window was linked to working-day jobs taking about 3.5% longer against plan for each standard deviation of rain days above normal, with no clear change in the chance of a late penalty."}),l.jsx("p",{children:"Weather is measured at county level, so each job's weather carries error, which would bias these results toward zero. They are associations, not causal estimates. Hurricanes and other regional shocks can raise both rain and repair work."}),l.jsx(vs,{children:l.jsx("p",{children:"If a contractor blames weather for a late penalty, check first whether weather days were already credited, then compare the job's rain days with the normal for that county and season. In Texas DOT records, the pattern points to rain credits absorbing most of the rain effect."})})]}),l.jsxs(gs,{id:"florida",title:"How much of Florida DOT's delay is weather and holidays?",children:[l.jsx("p",{children:"Florida DOT publishes a workbook of completed contracts that records original days, days used, and the weather and holiday days it removes. Mastt analysed the 431 contracts in its 2025-26 workbook. That is one year's cohort of contracts, not all Florida DOT construction."}),l.jsx(vf,{items:[{label:"Time over plan, all days counted",value:49,suffix:"%",context:"213,680 days used against 143,722 planned"},{label:"Time over plan, weather and holidays removed",value:13,suffix:"%",context:"161,751 days used against 143,722 planned"},{label:"Extra days removed by the two adjustments",value:74,suffix:"%",context:"51,929 of 69,958 extra days"}]}),l.jsx("p",{children:"These contracts used 213,680 days against 143,722 planned, which is 48.7% over. Florida DOT removed 32,701 weather days and 19,228 holiday days, leaving 161,751 days used and 12.5% over. The two adjustments account for 74% of the 69,958 extra days."}),l.jsx("p",{children:"The adjusted figure still leaves a tail. 91 contracts, 21%, ran more than 20% over their time even after the removals. Before adjustment, 290 contracts, 67%, did."}),l.jsxs(bf,{children:[l.jsx(sn,{n:4,title:"Where Florida DOT's extra days went",takeaway:"Weather and holiday days make up three quarters of the extra days.",source:"Mastt analysis of public contract records, Florida DOT, 2025-26 workbook. 431 contracts.",wide:!1,children:l.jsx(qE,{label:"Extra days used by 431 Florida DOT contracts",totalLabel:"Extra days used",unit:"days",formatValue:Gl,data:Rf.donut.map((t,e)=>({key:`f${e}`,label:t.label,value:t.value}))})}),l.jsx(sn,{n:5,title:"Contracts by time over plan, before and after adjustment",takeaway:"Contracts over 20% late fall from 290 to 91 once weather and holiday days are removed.",source:"Mastt analysis of public contract records, Florida DOT, 2025-26 workbook. 431 contracts.",wide:!1,children:l.jsxs(Af,{defaultValue:"raw",children:[l.jsxs(Mf,{children:[l.jsx(ma,{value:"raw",children:"All days counted"}),l.jsx(ma,{value:"adj",children:"Weather and holidays removed"})]}),l.jsx(pa,{value:"raw",children:l.jsx(Qn,{label:"Florida DOT contracts by time over plan, all days counted",period:"431 contracts in the 2025-26 workbook",unit:"contracts",averageLabel:"Average contracts per band",valueLabel:"Contracts",categoryLabel:"Time over plan",showAverage:!1,height:200,data:Rf.rawBands.map((t,e)=>({key:`r${e}`,label:t.label,axisLabel:["On time","Up to 10%","10 to 20%","20 to 50%","Over 50%"][e],value:t.n}))})}),l.jsx(pa,{value:"adj",children:l.jsx(Qn,{label:"Florida DOT contracts by time over plan, weather and holidays removed",period:"431 contracts in the 2025-26 workbook",unit:"contracts",averageLabel:"Average contracts per band",valueLabel:"Contracts",categoryLabel:"Time over plan",showAverage:!1,height:200,data:Rf.adjBands.map((t,e)=>({key:`j${e}`,label:t.label,axisLabel:["On time","Up to 10%","10 to 20%","20 to 50%","Over 50%"][e],value:t.n}))})})]})})]}),l.jsxs("p",{children:["Florida DOT ties weather relief to the work affected. Its ",l.jsx(ha,{href:"https://www.fdot.gov/docs/default-source/content-docs/construction/constadm/guidelist/inspectguidelist/fy1617/GL-16C.pdf",children:"statewide inspection guide for time extensions (2016-17)"})," says extensions for weather, holidays and special events may be granted only when 50% or more of the predetermined controlling work items are affected, or when major repairs to weather damage affect that share. Rules differ by owner and by edition, so check the version your contract references."]}),l.jsxs("p",{children:["Counting rules differ everywhere. Nguyen and colleagues list the definition of normal weather, weather thresholds, lingering days and the difference between work days and calendar days lost among the causes of discrepancy. The Society of Construction Law's ",l.jsx(ha,{href:"https://scl.org.uk/resources/news/second-edition-delay-disruption-protocol",children:"Delay and Disruption Protocol"}),", whose second edition appeared in 2017, is the common reference for determining extensions of time and compensation, and it is free to download. An owner reporting 49% delay and another reporting 13% may be describing the same performance."]}),l.jsx(vs,{children:l.jsx("p",{children:"Before comparing delay between owners, check how each one counts weather and holiday days. Ask whether the figure is raw or adjusted, and report both when you publish your own."})})]}),l.jsxs(gs,{id:"late-jobs",title:"How often are Texas DOT jobs late, and what do penalties cost?",children:[l.jsxs(Xs,{title:"One in six active jobs is past its allowed days",children:[l.jsxs("p",{children:["A snapshot of active jobs gives a different view from completed contracts. Texas DOT monthly progress reports list active state-let construction contracts with their allowed days and days charged. In January 2017, ",l.jsx("b",{children:"17.1%"})," of 1,519 active jobs had used more than all of their allowed days. In November 2024 the figure was ",l.jsx("b",{children:"16.4%"})," of 2,112 jobs. About one job in six was past its time on both dates, even though the live book of work grew from $14.5 billion to $40.7 billion in contract value, before any adjustment for inflation."]}),l.jsx(sn,{n:6,title:"Active Texas DOT jobs by share of allowed time used",takeaway:"The whole spread barely moved between 2017 and 2024.",source:"Mastt analysis of public records, Texas DOT monthly progress reports, January 2017 and November 2024. State-let construction jobs under 100% complete.",note:"Share of allowed time used includes any days granted by change order.",children:l.jsx(qC,{label:"Share of active jobs by share of allowed time used",startLabel:"Jan 2017",endLabel:"Nov 2024",formatValue:P3,highlightKey:"Over 100%",ran r $5 million. The share of jobs charged peaks at about 24% for jobs of $1 million to $20 million."}),l.jsx(vs,{children:l.jsx("p",{children:"Penalties are common but rarely large. Do not count on a median of $18,000 to recover what a late job costs you in extended supervision and disruption. Check your daily rate against the real daily cost of delay. About one job in six past its time is a rough Texas DOT benchmark, and a far higher share in your own portfolio is a warning sign."})})]})]}),l.jsxs(gs,{id:"risk-registers",title:"What do public project risk registers cover?",children:[l.jsx("p",{children:"A risk register is the working list of what could go wrong on a project and what the team will do about it. Mastt analysed the latest public version of 64 project risk registers, 53 Australian and 11 from the United States, published by councils, regulators, state parliaments and transport agencies or released under freedom of information."}),l.jsxs("p",{children:[l.jsx("b",{children:"88%"})," list community or stakeholder risks, the most common theme. Approvals and permits appear in 83%, weather and flooding in 75% and heritage and culture in 72%. Cost escalation shows up in 55%, contamination in 52% and ground conditions in 50%. Utilities (39%), scope and design change (39%) and supply chain or labour (36%) appear far less often."]}),l.jsx(sn,{n:8,title:"Most common risk themes in 64 public project risk registers",takeaway:"Neighbours, approvals and weather lead the list in both countries.",source:"Mastt analysis of 64 public project risk registers, 53 Australian and 11 US, latest version of each.",note:"Themes found by keyword rules across each register. 11 of 12 random matches checked by hand were real risk entries. The United States group is small.",children:l.jsxs(Af,{defaultValue:"all",children:[l.jsxs(Mf,{children:[l.jsx(ma,{value:"all",children:"All 64 registers"}),l.jsx(ma,{value:"au",children:"Australia (53)"}),l.jsx(ma,{value:"us",children:"United States (11)"}),l.jsx(ma,{value:"table",children:"All 18 themes"})]}),l.jsx(pa,{value:"all",children:l.jsx(Qn,{label:"Share of registers listing each theme, all registers",period:"64 public project risk registers",averageLabel:"Average of these nine themes",valueLabel:"Registers listing theme",categoryLabel:"Risk theme",showAverage:!1,formatValue:Ci,data:kf("allPct")})}),l.jsx(pa,{value:"au",children:l.jsx(Qn,{label:"Share of registers listing each theme, Australia",period:"53 Australian project risk registers",averageLabel:"Average of these nine themes",valueLabel:"Registers listing theme",categoryLabel:"Risk theme",showAverage:!1,formatValue:Ci,data:kf("auPct")})}),l.jsx(pa,{value:"us",children:l.jsx(Qn,{label:"Share of registers listing each theme, United States",period:"11 US project risk registers",averageLabel:"Average of these nine themes",valueLabel:"Registers listing theme",categoryLabel:"Risk theme",showAverage:!1,formatValue:Ci,data:kf("usPct")})}),l.jsx(pa,{value:"table",children:l.jsx("div",{style:{minWidth:560},children:l.jsx(Sf,{rowKey:"theme",rows:Ek,columns:Nk,defaultSort:{key:"all",direction:"desc"},caption:"Risk themes across 64 public project risk registers"})})})]})}),l.jsxs("p",{children:["The gaps say as much as the common themes. Only ",l.jsx("b",{children:"9 of 64"})," registers, 14%, list a contractor or subcontractor going insolvent. ASIC's ",l.jsx(ha,{href:"https://www.asic.gov.au/about-asic/corporate-publications/newsletters/asic-corporate-insolvency-update/asic-corporate-insolvency-update-issue-41-october-2026",children:"Corporate Insolvency Update of October 2026"})," lists construction as the most common industry for appointments in 2025-26, at 24.5%, in a year when 14,153 companies entered external administration for the first time. Only 3 of the 18 Australian registers dated 2022 or later list the risk, and 7 of those 18 come from one network company. Where a fix is given, it is usually a financial check of the contractor at tender."]}),l.jsxs("p",{children:["Climate change appears in 6 of the 64 registers but as a risk to the project in only ",l.jsx("b",{children:"3"}),", or 5%. The other three mention it in a definitions legend or as the project's own emissions. None of the 64 mention cyber risk, and 1 in 5 still mention COVID or pandemics."]}),l.jsxs(bf,{children:[l.jsx(sn,{n:9,title:"Registers that list contractor insolvency",takeaway:"9 of 64 registers, one square each.",source:"Mastt analysis of 64 public project risk registers, latest version of each. Every match read by hand.",wide:!1,children:l.jsx(yl,{label:"Registers that list contractor or subcontractor insolvency",unit:"registers",rows:8,columns:8,accentKey:"listed",decimals:0,formatValue:t=>`${t} registers`,data:[{key:"listed",label:"List contractor insolvency",value:9},{key:"none",label:"Do not list it",value:55,color:L1}]})}),l.jsx(sn,{n:10,title:"Registers that treat climate change as a risk",takeaway:"3 of 64 treat it as a project risk. 3 more only mention it.",source:"Mastt analysis of 64 public project risk registers, latest version of each. Every climate change match read by hand.",wide:!1,children:l.jsx(yl,{label:"Registers that treat climate change as a project risk",unit:"registers",rows:8,columns:8,accentKey:"risk",decimals:0,formatValue:t=>`${t} registers`,data:[{key:"risk",label:"Treat it as a project risk",value:3},{key:"mention",label:"Mention it only in a legend or as own emissions",value:3,color:"var(--series-3)"},{key:"none",label:"Do not mention it",value:58,color:L1}]})})]}),l.jsx(vs,{children:l.jsx("p",{children:"Use the top themes as a checklist, and ask why if your register skips community, approvals or weather. Add contractor insolvency with a trigger to recheck the contractor's finances during the job, not only at tender. For long-lived assets, put climate risk in the project register where the team will see it."})})]}),l.jsxs(gs,{id:"stale-register",title:"What does an unchanged risk register look like?",children:[l.jsx("p",{children:"One public hospital bond program in Washington State publishes its risk table inside each monthly status report. Mastt compared the table across the six 2024 reports it holds, for January, March, April, May, November and December. The risk text is identical in all six. The same 17 risks appear word for word, typos included. Two risk numbers are used twice, and no risk is marked closed at any point."}),l.jsx(sn,{n:11,title:"One public hospital program's risk table, 2024 and 2025",takeaway:"Six reports across 2024 carry the same 17 risks. The 2025 versions are rebuilt.",source:"Mastt analysis of monthly status reports from a public hospital bond program in Washington State. Six 2024 reports compared by text. Four 2025 reports read with text recognition software.",note:"No means the feature was not seen in the table text. Risk text in the 2024 reports is identical, apart from page headers.",children:l.jsx("div",{style:{minWidth:560},children:l.jsx(Sf,{rowKey:"report",rows:Rk,columns:Dk,caption:"Risk table features by monthly report"})})}),l.jsx("p",{children:"The 2025 tables look different. By June 2025 the table gains a closed and realised section. By September it carries a rating and a response strategy for each risk. By November and December it is a dated register with owners, ratings, strategies, mitigation actions and a list of closed and realised risks. The rebuild shows the program moved to a structure that records change. It does not show how risks were managed in 2024 outside the published table."}),l.jsxs("p",{children:["The ",l.jsx(ha,{href:"https://committee.iso.org/standard/65694.html",children:"ISO 31000:2018"})," guidelines describe a process of identifying, analysing, evaluating, treating, monitoring and communicating risks, and say any organisation, whatever its size, activity or sector, can use them. A published table that shows no change from January to December gives no sign that monitoring took place."]}),l.jsx(vs,{children:l.jsx("p",{children:"Date every review and show what moved since the last one. Record changes in rating, owner and status, and close risks explicitly when they pass or occur. Publish the closed list next to the open one."})})]}),l.jsxs(gs,{id:"approvals",title:"How long do approvals and delivery take?",children:[l.jsxs(Xs,{title:"NYC school change orders",children:[l.jsxs("p",{children:["NYC School Construction Authority records show how long a change takes to approve. Of 5,850 change issues in a November 2021 snapshot, 1,095 had reached an approved change order. The median time from a change being raised to its approval was ",l.jsx("b",{children:"224 days"}),". A quarter took longer than 516 days, and one in ten took close to 1,000 days. In Queens the median was 396 days. In Brooklyn it was 166."]}),l.jsx(vf,{items:[{label:"Median days to approve a change order",value:224,context:"1,095 approved changes, issue to approval"},{label:"Queens median, days",value:396,context:"309 approved changes"},{label:"Brooklyn median, days",value:166,context:"245 approved changes"}]}),l.jsx(sn,{n:12,title:"Days from a change being raised to approval, by borough",takeaway:"Queens approvals are both slower and far more spread out. Medians are 396 days in Queens, 225 in Staten Island, 205 in Manhattan, 175 in the Bronx and 166 in Brooklyn.",source:"Mastt analysis of public records, NYC School Construction Authority change order records, snapshot November 2021. 1,095 approved changes in five boroughs.",note:"QN Queens, SI Staten Island, MN Manhattan, BX Bronx, BK Brooklyn. Axis stops at 1,500 days, and 4% of approvals took longer. Five approvals coded to an unknown borough are not shown.",children:l.jsx(sD,{label:"Days from change raised to approval, by borough",unit:"days",domain:[0,1500],bandwidth:45,rowHeight:64,overlap:.6,tint:!0,formatValue:t=>`${Math.round(t)} days`,series:Lk})}),l.jsx("p",{children:"Of the 5,850 change issues, 81% were still open at the snapshot, and 87% of those t of design."]})}),l.jsxs(Xs,{title:"Victorian state projects",children:[l.jsxs("p",{children:["Victorian state budget documents show how often finish dates move. Across ",O1.n," projects that appear in two or more budget years, ",l.jsx("b",{children:"47%"})," had their completion date pushed back. The typical slip among those was 4 quarters, and about a quarter slipped by more than 8 quarters. The Victorian Auditor-General's Office reviewed 110 major projects worth $149.33 billion in a report tabled in March 2026 and found that the state budget document for the capital program ",l.jsx(ha,{href:"https://www.audit.vic.gov.au/report/major-projects-performance-reporting-2025",children:"does not always include meaningful information about changes to cost, scope and completion dates"}),". That gap limits how reliable any count of slipped projects can be, ours included."]}),l.jsx(sn,{n:14,title:"How far Victorian finish dates moved, projects pushed back",takeaway:"A typical slip was four quarters, and about a quarter of slips ran past two years.",source:"Mastt analysis of public records, Victorian state budget documents, three budget years between 2016-17 and 2026-27. 138 projects pushed back, of 293 with comparable dates.",note:"A few extreme slips look like keying errors in the source dates.",children:l.jsx(Qn,{label:"Victorian projects by quarters of completion slip",period:"138 projects pushed back, three budget years",unit:"projects",averageLabel:"Average projects per band",valueLabel:"Projects",categoryLabel:"Slip",showAverage:!1,data:O1.bands.map((t,e)=>({key:`v${e}`,label:t.label,axisLabel:["1 to 2","3 to 4","5 to 8","9 or more"][e],value:t.n}))})})]}),l.jsx(vs,{children:l.jsx("p",{children:"Approval time is a cost of its own. Track who is holding each change and for how long, and report schedule and budget together, because they can move in opposite directions. Show the original budget and date next to the status colour, or the colour can mislead."})})]}),l.jsx(fM,{items:[{question:"How often does Texas DOT excuse rain days when gauges show little rain?",answer:"On 47% of the 2,170 weekdays Texas DOT credited for rain, county gauges showed under a tenth of an inch on the day or the day before, and 32% were fully dry. That is a signal rather than proof, because site conditions can lag rain and gauges can miss patchy storms."},{question:"Do wetter seasons cause more late penalties on Texas DOT jobs?",answer:"No. 12% of working-day contracts were charged late penalties in both the driest and the wettest fifth of seasons. The three middle fifths were higher, at 16% to 18%, so there is no straight-line pattern."},{question:"Why does Florida DOT show 13% delay on one measure and 49% on another?",answer:"The 431 contracts in Florida DOT's 2025-26 workbook used 48.7% more days than planned, but 12.5% more once 32,701 weather days and 19,228 holiday days were removed. The adjustment removes 74% of the extra days."},{question:"What share of active Texas DOT jobs are past their allowed days?",answer:"About one in six. 17.1% of active jobs in January 2017 and 16.4% in November 2024 had used more than all of their allowed days."},{question:"How big are Texas DOT late penalties?",answer:"The median penalty was $18,000, or 0.7% of contract value, and 22% of 10,041 completed construction contracts were charged one. Total penalties of $109 million compare with $57 billion of contract awards."},{question:"Which risks do project risk registers leave out?",answer:"Only 14% of 64 public registers list contractor insolvency, 5% treat climate change as a project risk and none mention cyber risk. By contrast 88% list community risks and 83% list approvals."},{question:"How long do NYC school change orders take to approve?",answer:"The median was 224 days among 1,095 approved change orders in a November 2021 snapshot, and a quarter took longer than 516 days. In Queens the median was 396 days and in Brooklyn 166."}]}),l.jsx(dM,{citeAs:"Mastt, Constr
