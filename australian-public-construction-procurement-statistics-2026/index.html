 or more budgets pushed them back, by a median of 4 quarters, or a year."}),l.jsx("p",{children:"State budgets list the estimated total cost of each capital project year after year. Mastt matched projects across budgets by name, and in Queensland also by region, across 12 Queensland budgets (2014-15 to 2026-27) and three machine-readable Victorian budgets (2016-17, 2017-18 and 2026-27), which also carry completion dates."}),l.jsx(hl,{items:[{label:"Queensland median growth, 3+ budgets",value:24,suffix:"%",context:"Median 24.2% across 583 projects, first to last estimate"},{label:"Queensland grew more than 10%, 3+ budgets",value:59,suffix:"%",context:"58.7% grew by more than 10%, and 14.6% fell"},{label:"Victorian finish dates pushed back",value:47,suffix:"%",context:"47.1% of 293 projects with finish dates in 2+ budgets"},{label:"Median Victorian slip",value:4,suffix:" quarters",context:"Among the 138 projects that slipped"}]}),l.jsxs(Ot,{title:"Queensland estimates grow the longer a project stays in the budget",children:[l.jsx(en,{n:8,title:"Project cost growth in state budgets, first to last estimate",takeaway:"The longer a project stays in the budget, the more its estimate grows.",source:"Mastt analysis of published Queensland and Victorian state budget documents.",note:"Growth compares each project's first and last published cost estimate, which can reflect scope changes as well as price. A median of 0.0% means the middle project in that group had the same estimate in its first and last budget. The groups overlap: projects in three or more budgets are also counted in the two-or-more group. Finish later is the share of the 293 Victorian projects with a finish date in two or more budgets whose date moved later, so its base differs from the Projects column; Queensland budgets do not list finish dates.",children:l.jsx(wf,{rowKey:"group",defaultSort:{key:"grew10",direction:"desc"},itemName:{one:"group",other:"groups"},columns:[{key:"group",label:"Group",sortable:!1,w
