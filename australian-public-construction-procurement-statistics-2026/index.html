amended"}),", against 15% of contracts under $100,000."]}),l.jsxs("li",{children:[l.jsx("b",{children:"29% median value growth"})," among amended Commonwealth contracts, or 24% with Defence removed."]}),l.jsxs("li",{children:[l.jsx("b",{children:"69% of amended Commonwealth contracts are Defence"}),", which holds 53% of all contracts."]}),l.jsxs("li",{children:[l.jsx("b",{children:"34% of Queensland works worth $200,000 to $1 million went to limited tender"})," and 16% to open tender, with 30% not stating a method (68,394 contracts, mostly 2019 to 2026)."]}),l.jsxs("li",{children:[l.jsx("b",{children:"33% of Queensland contracts that state a form use the Main Roads Transport Infrastructure Contract"}),". AS 4000 accounts for 3.1%. Only 450 of 14,804 contracts state a form at all."]}),l.jsxs("li",{children:[l.jsx("b",{children:"+24% median cost growth"})," for Queensland projects listed in three or more state budgets, and 59% grew by more than 10%."]}),l.jsxs("li",{children:[l.jsx("b",{children:"47% of Victorian projects"})," in two or more budgets pushed back their finish date, by a typical 4 quarters."]}),l.jsxs("li",{children:[l.jsx("b",{children:"40.5% of priced Brisbane tenders"})," went to someone other than the cheapest tenderer. Another ",l.jsx("b",{children:"23.3%"})," of tendered awards recorded a single tenderer and ",l.jsx("b",{children:"12.0%"})," of all awards skipped tender."]}),l.jsxs("li",{children:[l.jsx("b",{children:"56% of Brisbane tendered awards were lump sum"}),", 44% schedule of rates."]}),l.jsxs("li",{children:[l.jsx("b",{children:"7 days median"})," for the ACT to pay a construction invoice, with 3.4% taking more than 30 days."]}),l.jsxs("li",{children:[l.jsx("b",{children:"75% of ACT payments"})," to construction suppliers land on a Tuesday or Thursday."]}),l.jsxs("li",{children:[l.jsx("b",{children:"49 NSW building work orders"})," issued in 2026 to 28 September are listed, against 15 from 2023. Only orders still in force stay listed."]}) egoryLabel:"Contract value",height:220,data:ak})}),l.jsx(dl,{items:[{label:"Contracts from $75,000 to $79,999",value:550,context:"About 383 expected from nearby bands"},{label:"Contracts at exactly $88,000",value:98,context:"Against 24 at exactly $80,000"},{label:"Agencies in the $75,000 band",value:62,context:"Defence holds 41% of them, below its 53% share overall"}]}),l.jsxs(Jn,{title:"The spike at $88,000",children:[l.jsx("p",{children:"The tallest bar sits in the $88,000 band, which holds 159 contracts against 70 in the band below and 58 in the band above. Most of that spike is 98 contracts valued at exactly $88,000, which is $80,000 plus 10% GST. Because the Rules count GST, a contract at $88,000 is above the old $80,000 limit. The pattern suggests some buyers read the limit as excluding GST."}),l.jsx("p",{children:"The spike is narrow. Twelve agencies account for all 98, and two of them account for 71. Of the 98, 38 are described as project management or project fees. It reads as a habit among a few buyers, not a national convention. Round figures plus GST are common across the range: $66,000, $77,000 and $110,000 all rank among the ten most common exact values, and each equals a round amount plus 10% GST (Figure 2)."}),l.jsx(Jt,{n:2,title:"Most common exact contract values between $60,000 and $130,000",takeaway:"$88,000 is the most common exact value in the range, ahead of $75,000 and $110,000.",source:"Mastt analysis of published Commonwealth contract notices, mostly 2013 to 2026.",children:l.jsx(bf,{rowKey:"value",defaultSort:{key:"contracts",direction:"desc"},itemName:{one:"value",other:"values"},columns:[{key:"value",label:"Exact contract value",numeric:!0,render:e=>bk(e)},{key:"contracts",label:"Contracts",numeric:!0},{key:"reading",label:"How the figure is built"}],rows:sk})})]}),l.jsxs(Jn,{title:"Why the pile sits at $80,000 and not at $7.5 million",children:[l.jsx("p",{children:"The Rules set a separate threshold of $7.5 million for construction services, and Hall & Wilcox reports that it was left unchanged. The pile near $80,000 therefore points to the general threshold applying to much of the building-related work agencies buy, such as maintenance, project management and design, rather than to works contracts as such."}),l.jsxs("p",{children:["Bunching below procurement thresholds is a documented pattern. ",l.jsx(qn,{href:G1,children:"Palguta and Pertold (2017)"})," found that public buyers clustered contracts just below newly introduced discretionary thresholds, mostly in construction and services. Bunching does not prove improper conduct. Lighter rules below a threshold can also save time and cost on small purchases."]})]}),l.jsx(Jn,{title:"Is the pile about to move?",children:l.jsxs("p",{children:["The change applies to new approaches to market released on or after 17 November 2025, according to ",l.jsx(qn,{href:L1,children:"MinterEllison"}),". Contracts signed in the months after that date mostly came from approaches released before it, so any effect arrives slowly. Of 1,915 contracts signed from 17 November 2025 to 28 September 2026, 33 sit in the $75,000 to $79,999 band, where about 21 would be expected, and 17 sit in the $120,000 to $124,999 band, where about 15 would be expected. That is no clear move yet. The number to watch is the count just under $125,000 in contracts signed from late 2026."]})}),l.jsx(ya,{children:l.jsx("p",{children:"Value contracts on the same GST basis the Rules use, and record how each scope was sized against a threshold. If you sell to Commonwealth agencies, expect small-works and services scopes sized to fit under the limit. If you manage a pipeline, watch for the pile moving to $125,000 and review how work is packaged when it does."})})]}),l.jsxs(Wn,{id:"amendments",title:"How often are Commonwealth construction contracts amended?",children:[l.jsx("p",{children:"Of 31,773 Commonwealth construction contracts, 10,661 (33.6%) were amended at least once, mostly 2013 to 2026. The rate rises with contract size (Figure 3). About 1 in 7 contracts under $100,000 was amended, against roughly 7 in 10 at $1 million and above."}),l.jsx(Jt,{n:3,title:"Share of Commonwealth construction contracts amended, by original value",takeaway:"Amendments become the normal case once a contract passes $1 million.",source:"Mastt analysis of published Commonwealth contract notices, mostly 2013 to 2026.",note:"Amendments include option exercises and time extensions as well as scope changes.",children:l.jsx(vo,{label:"Share of contracts amended",period:"Contracts by original value, mostly 2013 to 2026",unit:"%",averageLabel:"Average of the five size bands",valueLabel:"Contracts amended",categoryLabel:"Contract value",height:200,formatValue:za,data:ik})}),l.jsx("p",{children:"Amendments are not all scope change. The Commonwealth contract notice system records option exercises and time extensions as amendments, so the rate overstates how often scope changed. Among amended contracts, the median value growth was 29.4% (10,302 contracts)."}),l.jsx("p",{children:"Smaller contracts that are amended grow by more in proportion. The median amended contract under $100,000 grew 79.6%, against 7.3% for those over $100 million (Figure 4). One extra variation weighs more on a small base."}),l.jsx(Jt,{n:4,title:"Amendment rate and value growth by contract size",takeaway:"Large contracts are amended more often but grow by less in proportion.",source:"Mastt analysis of published Commonwealth contract notices, mostly 2013 to 2026.",note:"Growth is the change from original to latest value, as a share of original value, for amended contracts. One quarter of amended contracts grew by more than the 75th percentile figure.",children:l.jsx(bf,{rowKey:"band",itemName:{one:"size band",other:"size bands"},columns:[{key:"band",label:"Original value",sortable:!1,width:170},{key:"contracts",label:"Contracts",numeric:!0,width:85,render:e=>e.toLocaleString("en-AU")},{key:"amendedPct",label:"Amended",numeric:!0,width:85,render:e=>za(e)},{key:"medianGrowth",label:"Median growth",numeric:!0,width:130,render:e=>za(e)},{key:"p75Growth",label:"75th percentile",numeric:!0,width:120,render:e=>za(e)}],rows:ok})}),l.jsxs(Jn,{title:"How much of this is Defence?",children:[l.jsx("p",{children:"Defence holds 53.0% of the contracts and 68.8% of the amended ones (Figure 5). Its amendment rate is 43.5%, against 22.3% for every other agency combined. With Defence removed, amended contracts grew a median 24.4%, against 29.4% overall. Any national benchmark for Commonwealth construction is largely a Defence benchmark, so split it out before comparing an agency's own rate."}),l.jsx(Jt,{n:5,title:"Defence share of Commonwealth construction contracts",takeaway:"Defence is about half of all contracts and just over two thirds of the amended ones.",source:"Mastt analysis of published Commonwealth contract notices, mostly 2013 to 2026.",children:l.jsx(wk,{})})]}),l.jsx(ya,{children:l.jsx("p",{children:"Plan for change as the normal case on anything at $1 million and above, where 7 in 10 contracts are amended. Report option exercises and time extensions separately from scope change so your own rate can be compared with these figures. If you are a non-Defence agency, benchmark against the non-Defence rate of 22%."})})]}),l.jsxs(Wn,{id:"queensland",title:"How do Queensland agencies buy construction?",children:[l.jsxs("p",{children:["Queensland agencies must publish details of awarded contracts of $10,000 and above, including GST, within 60 days of award, according to the ",l.jsx(qn,{href:z1,children:"Queensland Government contract disclosure guide"}),". For contracts of $500,000 and above, the guide requires the procurement method to be recorded as open, selective or limited. That requirement may help explain why no method is recorded for 73% of disclosed contracts under $200,000 and 30% from $200,000 to $1 million, against 3% from $1 million to $10 million."]}),l.jsxs("p",{children:["Disclosure is imperfect. The ",l.jsx(qn,{href:B1,children:"Queensland Audit Office"})," examined 90 contracts across five departments and found that only 25% were appropriately disclosed and 21% were not disclosed at all. The figures below are best read as a floor for what agencies did, not a full record."]}),l.jsx("p",{children:"Mastt analysed 68,394 Queensland works-related contracts from about 70 agencies, mostly awarded from 2019 to 2026 and worth A$145 billion in total. Among works worth $200,000 to $1 million, 34% went to limited tender and 16% to open tender, with 15% selective and 30% not stated (Figure 6). From $1 million to $10 million, 31% were limited and 46% open. Above $10 million, open tender covers 74%. By value, open tender accounts for 48% of the total and limited tender for 36%."}),l.jsx(Jt,{n:6,title:"Queensland works contracts by procurement method and contract value",takeaway:"Open tender takes over as contracts grow, and mid-size work has the largest share of limited tender among stated methods.",source:"Mastt analysis of published Queensland contract disclosure records, mostly 2019 to 2026.",note:"Shares include rows that do not state a method.",children:l.jsx(Sk,{})}),l.jsxs(Jn,{title:"Which contract forms does Queensland use?",children:[l.jsx("p",{children:"Only 450 of 14,804 Queensland contracts (3%) state their form of contract. Of those, 33.3% use the Main Roads Transport Infrastructure Contract, ahead of other forms (22.2%), purchase orders (14.7%), stand-alone or service agreements (12.4%) and panel or standing offers (7.6%). AS 4000 accounts for 3.1% and AS 2124 for 2.9% (Figure 7). Agencies that name a form may differ from those that do not, so the mix is indicative."}),l.jsx(Jt,{n:7,title:"Form of contract where the form is stated, Queensland",takeaway:"The Main Roads contract is used about ten times as often as AS 4000.",source:"Mastt analysis of published Queensland contract disclosure records, 450 contracts that state a form.",note:"Tile size shows the number of contracts.",children:l.jsx(vN,{label:"Queensland contracts by form of contract",height:340,formatValue:e=>`${e} contracts`,data:ck})})]}),l.jsx(ya,{children:l.jsx("p",{children:"Track direct approaches as well as open tenders, because a third of mid-size works went to limited tender. Contract templates built around AS 4000 alone will not match much of the Queensland government work that states a form. If you publish contract data, complete the method and form fields, since blanks make competition impossible to measure."})})]}),l.jsxs(Wn,{id:"budgets",title:"How much do state projects grow in cost and slip?",children:[l.jsx("p",{children:"State budgets list the estimated total cost of each capital project year after year. Mastt matched projects across budgets by name and region and compared the first and last estimate. The Queensland data covers 12 budgets from 2014-15 to 2026-27. The Victorian data covers three machine-readable budget years (2016-17, 2017-18 and 2026-27), which also carry completion dates."}),l.jsx(Jt,{n:8,title:"Project cost growth in state budgets, first to last estimate",takeaway:"The longer a project stays in the budget, the more its estimate grows.",source:"Mastt analysis of published Queensland and Victorian state budget documents.",note:"Estimates include scope changes. Growth is first to last estimate; growth outside minus 90% and plus 1,000% is excluded. Finish later is the share of projects with a later completion date. Projects listed in more budgets are those that ran longer, so rows compare groups, not one project over time.",children:l.jsx(bf,{rowKey:"group",defaultSort:{key:"grew10",direction:"desc"},itemName:{one:"group",other:"groups"},columns:[{key:"group",label:"Group",sortable:!1,width:200},{key:"projects",label:"Projects",numeric:!0,width:80,render:e=>e.toLocaleString("en-AU")},{key:"medianGrowth",label:"Median growth",numeric:!0,width:130,render:e=>za(e)},{key:"grew10",label:"Grew over 10%",numeric:!0,width:130,render:e=>za(e)},{key:"finish",label:"Finish later",numeric:!0,width:100,render:e=>e==null?"Not listed":za(e)}],rows:uk})}),l.jsx("p",{children:"In Queensland, projects listed in three or more budgets grew a median 24.2% from first to last estimate (Figure 8). Of those, 58.7% grew by more than 10% and 14.6% fell. Across all projects in two or more budgets, 38.1% grew by more than 10%. Projects over $100 million drifted least, with 24.0% growing by more than 10%."}),l.jsx("p",{children:"In Victoria, 27.0% of projects in two or more budgets grew by more than 10%. Of 293 projects with finish dates in more than one budget, 47.1% pushed their finish date back, 16 brought it forward and the rest held it. The typical slip was 4 quarters, and at least a quarter of those that slipped moved by 8 quarters or more."}),l.jsx(dl,{items:[{label:"Queensland median growth, 3+ budgets",value:24,suffix:"%",context:"Median 24.2% across 583 projects, first to last estimate"},{label:"Queensland grew more than 10%, 3+ budgets",value:59,suffix:"%",context:"58.7% grew by more than 10%, and 14.6% fell"},{label:"Victorian finish dates pushed back",value:47,suffix:"%",context:"47.1% of 293 projects with dates in 2+ budgets"},{label:"Typical Victorian slip",value:4,suffix:" quarters",context:"Among projects that slipped"}]}),l.jsx("p",{children:"The two states are not directly comparable. Queensland covers more years, Victoria's tables list finish dates and Queensland's do not, and both estimates include scope changes as well as price growth. The closest like-for-like comparison, projects in two or more budgets, is 38.1% for Queensland and 27.0% for Victoria."}),l.jsxs("p",{children:["The pattern is consistent with earlier work. ",l.jsx(qn,{href:q1,children:"Terrill, Coates and Danks"})," of the Grattan Institute analysed a sample of 836 road and rail projects over $20 million between 2001 and 2015 and found systematic cost overruns, with overruns more likely on projects that were not approved or abandoned quickly. That points the same way as the Queensland result, where projects that stay longer in the budget show larger estimate growth."]}),l.jsx(ya,{children:l.jsx("p",{children:"Treat the first published estimate as a starting point, not a final figure. Record the original budget and finish date beside the current figures in your reports so drift stays visible, and compare projects of the same age rather than the same size."})})]}),l.jsxs(Wn,{id:"brisbane",title:"How often does Brisbane pick the cheapest tender?",children:[l.jsx("p",{children:"Brisbane City Council publishes its contract decisions. Mastt analysed 702 of them from August 2020 to April 2025. Of these, 618 were tendered and 84 were awarded without tender. In 467 of the tenders, the prices of the other tenderers are recorded, so the winning price can be compared."}),l.jsxs("p",{children:["In 40.5% of those 467 tenders (189), the contract went to someone other than the cheapest tenderer (Figure 9). That is consistent with council policy. The ",l.jsx(qn,{href:U1,children:"Brisbane City Council Procurement Policy and Plan 2025-26"})," requires public tenders at $500,000 and above, applies a 30% local benefit weighting in the value for money assessment and describes a value for money index that weighs price and non-price factors equally. Earlier years of the period may have run under different settings."]}),l.jsx(Jt,{n:9,title:"Who won among 467 priced Brisbane tenders",takeaway:"The cheapest tender won 59.5% of the time, and the winner was usually within 25% of the cheapest.",source:"Mastt analysis of published Brisbane City Council contract decisions, August 2020 to April 2025.",note:"Winner premium is how much dearer the winning price was than the cheapest other tender. Some listed prices may not be like for like, for example unit rates against totals, so the largest premiums are indicative.",children:l.jsx(Dc,{label:"Priced Brisbane tenders by winner price against the cheapest tender",unit:"tenders",totalLabel:"Priced tenders",data:fk})}),l.jsx("p",{children:"The race is usually close. Among the 189 tenders not won by the cheapest tenderer, the winner was less than 10% dearer in 76, 10% to 25% dearer in 43 and 25% or more dearer in 70. On works contracts, the cheapest of the other tenders was typically 3.8% above the winning price. The extra price paid sits in a minority of awards. Where the cheapest tender did not win, the winning price was a median 15.2% above it."}),l.jsxs(Jn,{title:"Single bids and awards without tender",children:[l.jsx("p",{children:"Of the 618 tendered awards, 23.3% recorded a single tenderer. The rate was 40.7% for services and goods (91 awards) and 16.1% for works (347 awards). A typical works tender drew 3 tenderers, and half drew between 2 and 5. A single-tenderer award cannot test its price against alternatives."}),l.jsx("p",{children:"A further 84 of the 702 decisions (12.0%) were awarded without tender under procurement policy exemptions. The policy allows contract extensions by variation without a tender for routine contracts, up to $500,000 in total, and sole sourcing where it is in the public interest or where there is a lack of available tenderers."})]}),l.jsxs(Jn,{title:"Lump sum or schedule of rates",children:[l.jsx("p",{children:"Of 597 tendered awards that state a pricing basis, 55.8% were lump sum and 44.2% schedule of rates. For works, 238 were lump sum and 103 schedule of rates (Figure 10). Lump sum places more price risk on the contractor. Schedule of rates suits work where quantities are not known up front and leaves more measurement to settle during delivery."}),l.jsx(Jt,{n:10,title:"Awards without tender, and tendered awards by pricing basis, Brisbane",takeaway:"One award in eight skipped tender, and just over half of tenders were lump sum.",source:"Mastt analysis of published Brisbane City Council contract decisions, August 2020 to April 2025.",note:"Left, all 702 decisions. Right, 597 tendered awards that state a pricing basis. One cell is about 1%.",children:l.jsxs("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(15rem, 1fr))",gap:28},children:[l.jsx(h1,{label:"Brisbane awards by whether they were tendered",unit:"awards",data:dk}),l.jsx(h1,{label:"Brisbane tendered awards by pricing basis",unit:"awards",data:hk})]})})]}),l.jsx(ya,{children:l.jsx("p",{children:"Price alone does not win council work in Brisbane, so read the evaluation weightings before you price. Check whether a tender is lump sum or schedule of rates before you commit, because it decides who carries quantity risk. Services and goods tenders see far more single bids than works tenders."})})]}),l.jsxs(Wn,{id:"act",title:"How fast does the ACT pay construction invoices?",children:[l.jsx("p",{children:"Mastt analysed 13,262 published ACT Government invoices of $25,000 or more to construction suppliers, worth A$4.79 billion, received from April 2017 and paid by August 2026. Each record carries the date the invoice was received and the date it was paid."}),l.jsx("p",{children:"The median invoice was paid in 7 calendar days, which is 5 business days. Half were paid within a week, 18% took longer than 14 days, 9.8% longer than 20 days and 3.4% longer than 30 days. Invoice size made no difference to the middle of the pack, with a median of 7 days for invoices under $100,000, from $100,000 to $1 million and over $1 million, and a 75th percentile of 13, 13 and 12 days (Figure 11). The yearly median ranged from 6 days in 2022 to 11 in 2017 and 2019."}),l.jsx(Jt,{n:11,title:"Days from invoice received to paid, by invoice size, ACT",takeaway:"All three size groups peak around a week, with a tail out to three weeks.",source:"Mastt analysis of published ACT Government invoice records, 2017 to 2026.",note:"Small is 6,809 invoices under $100,000, mid is 5,464 from $100,000 to $1 million and large is 989 over $1 million. Each ridge is drawn from 200 evenly spaced percentile points of days to pay in that group. The axis stops at 40 days.",children:l.jsx($R,{label:"Days from invoice received to paid",unit:"days",domain:[0,40],bandwidth:1.5,rowHeight:84,formatValue:e=>`${Math.round(e)} days`,series:mk})}),l.jsx("p",{children:"Transport Canberra and City Services, the agency with the most invoices (2,657), was also among the slowest. Its median was 11 days and 7.8% of its invoices took more than 30 days. Of the 13 agencies with 200 or more invoices, 8 had a median of 7 days or less."}),l.jsxs(Jn,{title:"Payments land in runs",children:[l.jsx("p",{children:"Payments cluster on set days, which suggests they go out in runs. Tuesday accounts for 42.6% of payments and Thursday for 32.5%, so 75.1% land on one of those two days. Wednesday takes 16.3%, Friday 4.8% and Monday 3.8% (Figure 12). Two payments were dated on a weekend."}),l.jsx(Jt,{n:12,title:"Share of ACT construction payments by weekday paid",takeaway:"Three payments in four land on a Tuesday or Thursday.",source:"Mastt analysis of published ACT Government invoice records, 2017 to 2026.",note:"13,262 invoices. Two weekend payments are not shown.",children:l.jsx(vo,{label:"Share of payments by weekday",period:"Paid 2017 to 2026",unit:"%",averageLabel:"Average share per weekday",valueLabel:"Share of payments",categoryLabel:"Weekday",height:200,formatValue:za,data:pk})})]}),l.jsx(ya,{children:l.jsx("p",{children:"A week is a good public benchmark for ACT work, so use 7 days for the central case and 20 days for the slow end when you plan cash flow. Build the forecast around Tuesday and Thursday payment runs. A forecast that assumes payment on the day an invoice is approved can be out by several days."})})]}),l.jsxs(Wn,{id:"nsw",title:"Are NSW building defect orders rising?",children:[l.jsx("p",{children:"Building Commission NSW issues stop work orders, prohibition orders, building work rectification orders and rectification orders. A published order stays listed only while it remains in force, so these counts are a floor. Mastt analysed the 137 orders listed to 28 September 2026, the earliest dated December 2021."}),l.jsx("p",{children:"By year of issue, the register shows 1 order from 2021, 4 from 2022, 15 from 2023, 41 from 2024, 27 from 2025 and 49 from 2026 to date (Figure 13). Because orders drop off once they are revoked or complied with, earlier years are undercounted and the rise from 2023 is overstated. The 2026 count of 49 already exceeds every earlier full year, and 2025 sits below 2024, so the series shows orders still in force, not a clean count of orders issued."}),l.jsx(Jt,{n:13,title:"NSW building work orders listed, by year of issue",takeaway:"Orders from 2026 to date outnumber those from any earlier full year.",source:"Mastt analysis of published NSW building work orders, December 2021 to 28 September 2026.",note:"Only orders still in force, so older years are undercounted. 2026* is a part year, to 28 September.",children:l.jsx(vo,{label:"NSW building work orders listed by year of issue",period:"December 2021 to 28 September 2026",unit:"orders",averageLabel:"Average per year listed",valueLabel:"Orders issued",categoryLabel:"Year",height:200,data:yk})}),l.jsx(dl,{items:[{label:"Building work rectification orders",value:110,context:"80% of the 137 listed orders"},{label:"Prohibition orders",value:14,context:"12 stop work orders and 1 notice of condition"},{label:"Median days to fix, where stated",value:180,context:"29 orders, range 90 to 365 days"}]}),l.jsx("p",{children:"Of the 137 orders, 101 were issued under the Residential Apartment Buildings (Compliance and Enforcement Powers) Act 2020, 30 under the Home Building Act 1989 and 4 under the Design and Building Practitioners Act 2020, with 2 not stated. Only 29 of the 110 rectification orders state a time to comply on the register page, and those give a median of 180 days."}),l.jsx(ya,{children:l.jsx("p",{children:"Developers and builders should keep defect records, rectification programmes and sign-off evidence in a form they can produce quickly. When an order sets a period to fix the work, plan on months, not weeks, since 180 days is typical where the period is stated."})})]}),l.jsxs(Wn,{id:"letters",title:"How much paperwork sits inside a standard contract?",children:[l.jsxs("p",{children:["The NSW Government's ",l.jsx(qn,{href:H1,children:"GC21 Edition 2"})," general conditions come with a set of pro-forma letters for the principal's authorised person, which NSW describes as over 100. Mastt counted 109 in the sample letter suite. The MW21 contract for smaller works has 105 templates, 70 from the principal and 35 from the contractor. The ACT Government's design services suite holds 75 documents, of which 60 are clause-numbered notices, requests and instructions, including notices of variation and claim."]}),l.jsx("p",{children:"Mastt grouped the 109 GC21 letters by clause number. Variations and claims take the most, with 20 letters, followed by time and programme with 19 and set-up and instructions with 18 (Figure 14). Each letter is tied to a clause and often to a time limit, so each one is a step a project team must track."}),l.jsx(Jt,{n:14,title:"NSW GC21 sample letters by theme",takeaway:"Variations, time and set-up account for more than half of the 109 letters.",source:"Mastt analysis of public standard contract letter suites, NSW Government, edition dated June 2025.",note:"Themes are Mastt's grouping by clause number.",children:l.jsx(vo,{label:"GC21 sample letters by theme",period:"109 letters in the sample suite",unit:"letters",averageLabel:"Average per theme",valueLabel:"Letters",categoryLabel:"Theme",height:200,data:gk})}),l.jsx(ya,{children:l.jsx("p",{children:"The administrative load is built into the contract. Map each letter to its trigger and its deadline, keep a register of notices sent and received, and check which letters your special conditions have changed, because NSW notes that amended clauses mean the letters need review."})})]}),l.jsxs(Wn,{id:"compare",title:"How do Australian and US public owners compare?",children:[l.jsx("p",{children:"Two comparisons show how differently public owners pick winners and how much one buyer shapes national figures."}),l.jsxs(Jn,{title:"Texas almost always takes the lowest bid, Brisbane often does not",children:[l.jsxs("p",{children:["Texas DOT awarded 98.9% of 13,596 contracts, 2016 to 2024, at a price within $1 of the lowest bid. Brisbane gave 59.5% of its priced tenders to the cheapest tenderer (Figure 15). The rules suggest part of the reason. ",l.jsx(qn,{href:P1,children:"TxDOT guidance"})," quotes the federal requirement that federal-aid contracts be awarded only on the basis of the lowest responsive bid, while Brisbane scores value for money with a local benefit weighting."]}),l.jsx(Jt,{n:15,title:"Share of awards won by the lowest bid, Texas DOT and Brisbane",takeaway:"Texas takes the lowest bid almost every time. Brisbane does so about three times in five.",source:"Mastt analysis of published Texas DOT bid results, 2016 to 2024, and Brisbane City Council contract decisions, 2020 to 2025.",note:"The two owners buy different work and are not like for like. Texas DOT is a highway agency. Brisbane's tenders span works, services and goods.",children:l.jsx("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(14rem, 1fr))",gap:28},children:vk.map(e=>l.jsx(UN,{label:e.place,value:e.pct,min:0,max:100,detail:`${e.pct.toFixed(1)}% of awards to the lowest bid`},e.place))})}),l.jsx("p",{children:"Both owners see a similar number of bidders. A typical Brisbane works tender drew 3 tenderers, and a typical Texas DOT letting drew 3 bidders across all work and 4 on state construction."})]}),l.jsxs(Jn,{title:"Defence is the biggest federal buyer in both countries",children:[l.jsx("p",{children:"In the United States, the Department of Defense accounts for 62.2% of 583,728 completed federal construction contracts and delivery orders, fiscal years 2008 to 2026. In Australia, Defence accounts for 53.0% of 31,773 Commonwealth construction contracts. In both countries, Defence moves the national average. US Defense contracts changed value slightly less often than average (36.5% against 39.1%), while Australian Defence contracts were amended more often than the rest (43.5% against 22.3%). The two measures are not identical, so compare direction, not size. Neither figure includes state or local spending."}),l.jsx(dl,{items:[{label:"US federal construction from Defense",value:62,suffix:"%",context:"62.2%: 363,102 of 583,728 contracts"},{label:"Australian federal construction from Defence",value:53,suffix:"%",context:"53.0%: 16,854 of 31,773 contracts"},{label:"Australian amended contracts that are Defence",value:69,suffix:"%",context:"68.8%: 7,330 of 10,661 amended contracts"}]})]}),l.jsx(ya,{children:l.jsx("p",{children:"Any national federal benchmark is mostly a Defence benchmark, in both countries. Split Defence out before you compare your own contracts. When you compare owners, check first whether the winner is chosen on price alone or on a weighted score."})})]}),l.jsx(x7,{items:[{question:"How many Commonwealth construction contracts are amended?",answer:"33.6% were amended at least once (10,661 of 31,773 contracts, mostly 2013 to 2026). The rate runs from 14.9% under $100,000 to 72.6% over $100 million, and amendments include option exercises and time extensions."},{question:"What is the Commonwealth procurement threshold for construction?",answer:"The general threshold for non-corporate Commonwealth entities rose from $80,000 to $125,000 on 17 November 2025, including GST. A separate threshold of $7.5 million applies to construction services and was left unchanged."},{question:"How often does Brisbane pick the cheapest tender?",answer:"The cheapest tender won 59.5% of the 467 priced tenders analysed, so 40.5% went to someone else. The winner was usually within 25% of the cheapest price."},{question:"How long does the ACT take to pay construction invoices?",answer:"The median was 7 calendar days, or 5 business days, across 13,262 invoices from 2017 to 2026. 9.8% took longer than 20 days and 3.4% longer than 30 days."},{question:"How much do Queensland capital projects grow in cost?",answer:"Projects listed in three or more state budgets grew a median 24.2% from first to last estimate, and 58.7% grew by more than 10%. Across projects in two or more budgets, 38.1% grew by more than 10%."},{question:"How many standard letters does NSW GC21 include?",answer:"109 sample letters sit in the GC21 Edition 2 suite, which NSW describes as over 100. The MW21 contract for smaller works has 105 templates."},{question:"Are NSW building defect orders rising?",answer:"49 orders issued in 2026 to 28 September are listed, against 15 from 2023. The register lists only orders still in force, so earlier years are undercounted and the rise is overstated."}]}),l.jsx(w7,{citeAs:"Mastt, Australian Public Construction Procurement: 2026 Statistics, mastt.com.",methodology:l.jsxs(l.Fragment,{children:[l.jsx("p",{children:"Mastt analysed published public records. These were about 31,800 Commonwealth contract notices for building, construction and related services (mostly 2013 to 2026), about 68,000 Queensland contract disclosure rows (mostly 2019 to 2026), project listings in Queensland state budgets (12 budgets from 2014-15 to 2026-27) and Victorian state budgets (three machine-readable years), 702 Brisbane City Council contract decisions (August 2020 to April 2025), 13,262 ACT invoices (2017 to 2026) and 137 NSW building work orders (to 28 September 2026). We also counted standard contract letter suites and used Texas DOT bid results (2016 to 2024) and US federal contract awards (fiscal years 2008 to 2026) for comparison."}),l.jsx("p",{children:"A Commonwealth contract counts as construction when it covers building and construction services or has a works-type description. Growth is measured from original to latest value, and changes below minus 95% or above 2,000% are excluded. State project growth is measured from first to last budget listing, matched by name and region, and excludes changes below minus 90% or above 1,000%. ACT invoices with a missing received date, or a paid date before the received date, are excluded. The excess near $80,000 compares the $75,000 to $79,999 band with a smooth curve fitted to $5,000 bands from $40,000 to $200,000, leaving out $75,000 to $95,000."}),l.jsx("p",{children:"Findings are signals, not proof. Commonwealth amendments include option exercises and time extensions. Many Queensland records leave the method or form blank. State budget estimates include scope changes. The NSW register lists only orders in force. Texas figures describe Texas DOT work only. No contractor or company names are used."}),l.jsx("p",{children:"Includes public sector information from Australian federal, state, territory and local governments, used under Creative Commons Attribution 4.0 licences."})]}),items:[{title:"Commonwealth Procurement Rules: key updates to be aware of",publisher:"Hall & Wilcox",url:Ef,date:"19 November 2025"},{title:"New Commonwealth Procurement Rules commence 17 November 2025",publisher:"MinterEllison",url:L1,date:"30 October 2025"},{title:"Commonwealth Procurement Rules 17 November 2025",publisher:"Department of Finance, Federal Register of Legislation",url:V1},{title:"Contract disclosure guide",publisher:"Queensland Government",url:z1},{title:"Confidentiality and disclosure of government contracts, Report 8: 2017-18",publisher:"Queensland Audit Office",url:B1,date:"February 2018"},{title:"Procurement Policy and Plan 2025-26 (SP103)",publisher:"Brisbane City Council",url:U1,date:"approved 9 September 2025"},{title:"GC21 Edition 2",publisher:"NSW Government",url:H1,date:"updated 22 April 2026"},{title:"Cost overruns in Australian Transport Infrastructure Projects",publisher:"Terrill, Coates and Danks, Grattan Inst
