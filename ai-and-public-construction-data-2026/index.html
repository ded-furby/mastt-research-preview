sing from public data."]}),l.jsxs(l.Fragment,{children:["Two plain rules need no AI. Texas DOT jobs more than 10 points behind at the halfway mark paid late penalties on ",l.jsx("b",{children:"47%"})," of jobs against ",l.jsx("b",{children:"10%"})," for jobs ahead, and new firms' first Texas DOT jobs paid them on ",l.jsx("b",{children:"26%"})," against ",l.jsx("b",{children:"20%"})," for established firms."]})]}),l.jsx(sE,{items:[{id:"expect",label:"What do project teams expect from AI, and what can public data test?"},{id:"price",label:"Can a simple price model beat the engineer's estimate?"},{id:"late",label:"Can public data predict which projects finish late?"},{id:"drivers",label:"What drives the late-finish prediction?"},{id:"climate",label:"Does local climate help predict late finishes?"},{id:"documents",label:"How accurately can AI sort contract documents?"},{id:"gap",label:"Why can't public data show everyday project paperwork?"},{id:"rules",label:"Which simple rules already work without AI?"},{id:"summary",label:"What public data can and cannot do for AI"},{id:"faq",label:"FAQs"},{id:"sources",label:"Sources and methodology"}]}),l.jsxs(wa,{id:"expect",title:"What do project teams expect from AI, and what can public data test?",children:[l.jsxs("p",{children:["Mastt's survey found that AI is already routine for project teams. About 72% of respondents use AI at least weekly, yet only 9.3% use AI agents today and another 46.3% plan to start. Accuracy and trust ranked as the number one barrier to wider use (",l.jsx(Xn,{href:sd,children:"Mastt, State of AI in Construction Project Management 2026"}),", 108 respondents, surveyed March to June 2026)."]}),l.jsx(Gf,{title:"What the Mastt survey found",description:"Survey of 108 qualified construction project management professionals, March to June 2026.",stats:[{value:72.2,decimals:1,suffix:"%",label:"Use AI at least weekly",detail:"48.1% use it daily or more often."},{value:9.3,decimals:1,suffix:"%",label:"Use AI agents today",detail:"Another 46.3% plan to start."},{value:108,label:"Respondents",detail:"Accuracy and trust was named the biggest barrier."}]}),l.jsx("p",{children:"Trust depends on evidence. A tool that predicts a price, a late finish or a document type can be checked against what happened. Public records allow that check for a narrow set of tasks, mainly at transport agencies that publish contract records in volume. We ran three prediction tests on Texas DOT records, one document classification test and one inventory of public contract documents. The tests are deliberately plain. A plain model sets the bar that any AI tool has to clear before its extra cost and complexity are worth paying for."})]}),l.jsxs(wa,{id:"price",title:"Can a simple price model beat the engineer's estimate?",children:[l.jsx("p",{children:"The test prices every Texas DOT letting held in 2023 and 2024 using earlier data only. For each bid item, the model takes the median winning unit price for the same item, unit and quantity band over the previous 12 months, then multiplies by the engineer's quantities. Where an item has no earlier winning bid, the model falls back to the engineer's unit price. That affected about 2% of items in the median construction letting and none in the median maintenance letting. The result is compared with the low bid that won the contract."}),l.jsx("p",{children:"On 1,585 state construction lettings, the model missed the winning bid by a median 16.7%. The engineer's estimate missed by 12.8%. The model was closer than the engineer on 38% of lettings. On 1,185 maintenance lettings the model missed by 16.2% against 12.8%, and was closer on 41%."}),l.jsx(Gf,{title:"Median miss against the winning bid, construction lettings",description:"1,585 Texas DOT state construction lettings, 2023 and 2024. Lower is better.",stats:[{value:Es.construction.estimate,decimals:1,suffix:"%",label:"Engineer's estimate",detail:"Median absolute miss."},{value:Es.construction.blend,decimals:1,suffix:"%",label:"50/50 blend",detail:"Half model, half engineer."},{value:Es.construction.model,decimals:1,suffix:"%",label:"Price-history model",detail:"Prior 12 months of winning item prices."}]}),l.jsx("p",{children:"The texture of the misses matters as much as the median. The engineer's estimate sits 4.6% above the winning bid at the median, and the model sits 2.5% above. The model is less biased but noisier. It missed by more than 40% on 16.9% of construction lettings, against 7.9% for the engineer's estimate."}),l.jsx(nn,{n:1,title:"Where each method lands against the winning bid",takeaway:"The engineer's estimate clusters more tightly around the winning bid. The model has a longer tail on both sides.",source:"Mastt analysis of public contract records, Texas DOT, state construction lettings, 2023 and 2024 (1,585 lettings).",note:`From top to bottom the ridges are the engineer's estimate, the price-history model and the 50/50 blend. Miss is the method's price minus the winning bid, as a share of the winning bid. Misses beyond 60% either way are drawn at 60% (${bn(ad.beyond60.estimate)} of lettings for the estimate, ${bn(ad.beyond60.model)} for the model, ${bn(ad.beyond60.blend)} for the blend).`,children:l.jsx(zk,{label:"Miss against the winning bid, state construction lettings, 2023 and 2024",domain:[-60,60],rowHeight:92,formatValue:t=>`${Math.round(t)}%`,series:bL})}),l.jsxs("p",{children:["Texas DOT's own estimating manual describes the same approach. It says unit prices are usually determined by evaluating previously submitted low bid prices or average low bid prices, and that those figures should only be used as a starting point from which a more accurate price is derived with good engineering judgement (",l.jsx(Xn,{href:"https://www.txdot.gov/manuals/des/pse/chapter-5--engineer-s-estimate/section-4--prices/estimated-bid-price-determination.html",children:"Texas DOT, PS&E Preparation Manual, section 5.4.1"}),"). Our model is that starting point without the judgement. The result suggests the judgement is doing real work."]}),l.jsx(nn,{n:2,title:"Estimate misses by method and segment",takeaway:"The model trails the engineer's estimate on every measure in both segments. The blend sits close to the estimate, a little behind on construction and a little ahead on maintenance.",source:"Mastt analysis of public contract records, Texas DOT, state construction (1,585) and maintenance (1,185) lettings, 2023 and 2024.",note:"Median is the middle miss. The 75th and 90th percentiles are the misses that 1 in 4 and 1 in 10 lettings exceed. Within 10% and over 40% are shares of lettings.",children:l.jsxs(A2,{defaultValue:"construction",children:[l.jsxs(E2,{children:[l.jsx(Do,{value:"construction",children:"Construction"}),l.jsx(Do,{value:"maintenance",children:"Maintenance"})]}),l.jsx(Oo,{value:"construction",children:l.jsx(ci,{rowKey:"method",caption:"Construction lettings, miss against the winning bid",columns:R2,rows:C2.construction})}),l.jsx(Oo,{value:"maintenance",children:l.jsx(ci,{rowKey:"method",caption:"Maintenance lettings, miss against the winning bid",columns:R2,rows:C2.maintenance})})]})}),l.jsx("p",{children:"A 50/50 blend of the model and the engineer's estimate missed by 13.4% on construction and 12.4% on maintenance. That roughly matches the engineer alone at 12.8%. The model added little that the engineer had not already captured, which is a reasonable outcome for a model that sees only item prices."}),l.jsxs(Yf,{children:[l.jsx(nn,{n:3,title:"Construction lettings where the model was closer",takeaway:"The engineer's estimate was closer on about 62 in every 100 lettings.",source:"Mastt analysis of public contract records, Texas DOT, 1,585 construction lettings, 2023 and 2024.",children:l.jsx(Qy,{label:"Share of construction lettings where the model beat the engineer's estimate",accentKey:"model",formatValue:t=>bn(t),data:[{key:"model",label:"Model closer to the winning bid",value:Es.construction.closerModel},{key:"eng",label:"Engineer's estimate closer",value:100-Es.construction.closerModel}]})}),l.jsx(nn,{n:4,title:"Maintenance lettings where the model was closer",takeaway:"The gap is a little narrower, and the engineer still wins most lettings.",source:"Mastt analysis of public contract records, Texas DOT, 1,185 maintenance lettings, 2023 and 2024.",children:l.jsx(Qy,{label:"Share of maintenance lettings where the model beat the engineer's estimate",accentKey:"model",formatValue:t=>bn(t),data:[{key:"model",label:"Model closer to the winning bid",value:Es.maintenance.closerModel},{key:"eng",label:"Engineer's estimate closer",value:100-Es.maintenance.closerModel}]})})]}),l.jsxs("p",{children:["Published machine learning work reports lower errors with richer inputs. A 2022 study of public highway projects completed between 2004 and 2015 reported mean absolute percentage errors of 7.4% for duration and 4.5% for cost (",l.jsx(Xn,{href:"https://itcon.org/paper/2022/29",children:"Mohamed and Moselhi, Journal of Information Technology in Construction, 2022"}),"). That study addressed early conceptual estimates built from project characteristics, and it tested on 29 and 56 randomly selected projects. It reports a mean error on a different task and a small test sample, so it cannot be set directly against our median misses on 2,770 lettings priced from data that existed before each letting. It does suggest that project context, not item averages, is where an AI estimator may earn its place."]}),l.jsx(As,{children:l.jsx("p",{children:"If a vendor claims AI estimating, ask for the median miss against winning bids on jobs the model has not seen, and compare it with your own estimates. In this Texas test the bar is 12.8%. Use item price history as an input to your estimate, and keep the estimator's judgement in the loop."})})]}),l.jsxs(wa,{id:"late",title:"Can public data predict which projects finish late?",children:[l.jsxs("p",{children:["Here a job counts as late when it uses more than 100% of its contract time. Texas DOT's contract administration manual treats the time set for completion as an essential element of the contract, and it requires damages to be assessed for each day over the contracted time (",l.jsx(Xn,{href:"https://www.txdot.gov/manuals/cst/cah/prosecution_and_progress/progress_schedules-bcejejfc/failure_to_complete_work_on_time-i1019822.html",children:"Texas DOT, Construction Contract Administration Manual, Failure to Complete Work on Time"}),")."]}),l.jsx("p",{children:"The model is a simple machine learning model trained on completed Texas DOT contracts. It uses what is known at award, including the contract time allowed, job size, type of work, district, number of bid items, addenda, how the bidding went and the winning firm's earlier record with the owner. It trained on 7,160 completed contracts awarded up to 2021 and was tested on 4,066 contracts awarded from 2022."}),l.jsxs(Ol,{title:"What the 0.79 score means",children:[l.jsxs("p",{children:["The score is AUC. In plain words, pick one job that ran late and one that finished on time, both at random. The AUC is the share of such pairs where the model gave the late job the higher risk. A coin flip scores 0.5 and a perfect model scores 1.0 (",l.jsx(Xn,{href:"https://developers.google.com/machine-learning/crash-course/classification/roc-and-auc",children:"Google, Machine Learning Crash Course, ROC and AUC"}),"). On later years the model scored 0.79, so it ranked the late job higher about four times in five."]}),l.jsxs("p",{children:["On a random split of the same contracts the score was 0.83. A random split lets the model see jobs from the same years it is tested on, which tends to flatter it. Leakage of information from test data into training is a known source of inflated results. A review by Princeton researchers found leakage errors in 17 fields, affecting 329 papers and in some cases leading to badly overoptimistic conclusions (",l.jsx(Xn,{href:"https://arxiv.org/abs/2207.07048",children:"Kapoor and Narayanan, Leakage and the Reproducibility Crisis in ML-based Science"}),"). The later-years score is the one to trust."]})]}),l.jsxs(Yf,{children:[l.jsx(nn,{n:5,title:"Late-finish score on later years",takeaway:"A late job outranks an on-time job 79% of the time.",source:"Mastt analysis of public contract records, Texas DOT, 4,066 contracts awarded 2022 and later.",wide:!1,children:l.jsx(PD,{label:"Chance a late job outranks an on-time job",value:Xl.aucPct,detail:"AUC 0.79 on contracts awarded from 2022. A coin flip scores 50%."})}),l.jsx(nn,{n:6,title:"Late rate by predicted risk fifth",takeaway:"The riskiest fifth ran late 23% of the time. The other four fifths ran late 4.5% of the time.",source:"Mastt analysis of public contract records, Texas DOT, 4,066 contracts awarded 2022 and later.",note:"Each fifth holds about 813 jobs, so the headline figure on the chart is the late rate across all tested jobs (8.2%, shown rounded).",wide:!1,children:l.jsx($y,{label:"Share of jobs that ran late, by predicted risk fifth",period:"Contracts awarded 2022 and later",averageLabel:"Late rate, all jobs",valueLabel:"Ran late",categoryLabel:"Predicted risk",showAverage:!0,formatValue:t=>Number.isInteger(t)?`${t}%`:bn(t),data:xL})})]}),l.jsx("p",{children:"The ranking is useful, and it has limits. Across all tested jobs, 8.2% ran late. Even in the riskiest fifth, 77% of jobs finished within their time. A flag is a reason to look at a job, not a verdict on it."}),l.jsx(nn,{n:7,title:"Does predicted risk match what happened?",takeaway:"On average, calibrated risk is within about 2 points of real outcomes, but the 10 to 30% bands run about 4 points high.",source:"Mastt analysis of public contract records, Texas DOT, 4,066 contracts awarded 2022 and later.",note:"The 40 to 50% band holds only 31 jobs, so its 11 point gap is uncertain. Bands with fewer than 30 jobs are not shown. This is the calibrated version of the model, which also uses the share of each estimate in each type of work item. Its score on later years was 0.785.",children:l.jsx(BC,{label:"Predicted and actual late rate by risk band",categoryLabel:"Predicted risk band",height:260,curve:"linear",formatValue:t=>bn(t),formatTick:t=>`${Math.round(t)}%`,series:[{key:"predicted",label:"Predicted late rate",dashed:!0,area:!1},{key:"actual",label:"Actual late rate",area:!1}],data:_L})}),l.jsxs("p",{children:["Calibration means that when a model says a job has a 30% chance of running late, about 30% of such jobs do (",l.jsx(Xn,{href:"https://scikit-learn.org/stable/modules/calibration.html",children:"scikit-learn, Probability calibration"}),"). Without calibration the model's expected error was 7.3 points on the random split. With it, the expected error was 1.6 points on the random split and 1.9 points on later years. The average hides a pattern, because the bands from 10 to 30% still ran about 4 points above the actual late rate."]}),l.jsxs(Ol,{title:"What it flags on live jobs",children:[l.jsx("p",{children:"The same approach can be pointed at jobs under way. We scored monthly progress reports dated January to September 2026 for 3,275 Texas DOT jobs. The live watchlist gives each job a model risk score. Separately, a schedule rule flags 851 of them, or 26%, as behind schedule. The rule applies when time used is more than 15 points ahead of work complete and over half of the contract time has gone."}),l.jsx(ky,{items:[{label:"Live jobs scored",value:Xl.liveN,context:"Progress reports dated January to September 2026"},{label:"Flagged as behind schedule",value:Xl.liveBehind,context:"Time used more than 15 points ahead of work complete"},{label:"Share of live jobs flagged",value:Math.round(Xl.liveShare),suffix:"%",context:"851 of 3,275 jobs"}]})]}),l.jsx(As,{children:l.jsx("p",{children:"Ask any AI scheduling tool for its score on later years, not on a random split, and for a calibration check. Treat a risk flag as a prompt to review the programme, the contractor's resources and the open variations, because most flagged jobs still finish in time."})})]}),l.jsxs(wa,{id:"drivers",title:"What drives the late-finish prediction?",children:[l.jsx("p",{children:"To see what the model leans on, we shuffled each group of inputs in turn on the later-years test set and measured how far the score fell. A bigger fall means the model relied more on that group. Each group was shuffled as a unit, so the figures describe the group, not single inputs."}),l.jsx(nn,{n:8,title:"What the late-finish model relies on",takeaway:"Contract time allowed matters most. How the bidding went, addenda and award year added nothing measurable.",source:"Mastt analysis of public contract records, Texas DOT, 4,066 contracts awarded 2022 and later.",note:"Bars run from left to right as contract time allowed, type of work, job size, contractor record, place, addenda, award year and bidding. Drop in AUC, in points of 0.01, averaged over 20 shuffles. Groups whose drop was zero or below are drawn as zero. Inputs that share information understate each other.",children:l.jsx($y,{label:"Fall in late-finish score when each input group is shuffled",period:"Contracts awarded 2022 and later",unit:" points",averageLabel:"Average across the eight groups",valueLabel:"Fall in score",categoryLabel:"Input group",showAverage:!1,height:220,formatValue:t=>t.toFixed(1),data:wL})}),l.jsx("p",{children:"Contract time allowed produced the biggest fall at 7.1 points of AUC (0.071), followed by type of work at 5.1, job size at 4.9, contractor record at 4.4 and place at 3.5. The bidding pattern, addenda and award year added nothing measurable. The contractor record shows up in plain counts too. Among 9,692 completed jobs whose winner had worked for the owner before, jobs won by firms in the top quarter for past late-penalty rate ran late 19.6% of the time, against 5.2% for firms with no late penalties on earlier jobs."}),l.jsx("p",{children:"These results suggest the model relies mostly on structural facts about a job, such as how tight the contract time is and what kind of work it is. A planner already knows those facts. The model's likely use is ranking a whole portfolio quickly, not telling an experienced planner something new about one job."}),l.jsx(As,{children:l.jsx("p",{children:"Ask any vendor which inputs drive a risk score. If the score mostly mirrors contract time, job type and size, use it to sort a portfolio, and add the inputs only your team holds, such as programme logic, resourcing and open variations."})})]}),l.jsxs(wa,{id:"climate",title:"Does local climate help predict late finishes?",children:[l.jsxs("p",{children:["For predicting late finishes at bid time, the climate of the place and season adds almost nothing. We added 30-year averages of rain, freeze and heat days for each job's county and planned work window to two models trained on completed Texas DOT contracts, a simple one and a stronger tree-based one that this page calls the boosted model. Climate normals are averages over a 30-year period, and the latest World Meteorological Organization standard period is 1991 to 2020 (",l.jsx(Xn,{href:"https://community.wmo.int/node/36682",children:"World Meteorological Organization, WMO Climatological Normals"}),")."]}),l.jsx(nn,{n:9,title:"Late-finish and change-order scores with and without local climate",takeaway:"Climate averages moved the late-finish score from 0.780 to 0.782 in the simple model and from 0.790 to 0.789 in the boosted model.",source:"Mastt analysis of public contract records and rain gauge records, Texas DOT, trained on 16,353 contracts awarded 2009 to 2020 and tested on 8,717 awarded 2021 to 2024.",note:"Scores are AUC. Late means days charged ran past days allowed, which is when late penalties apply. Changes means a change order that added contract days. The slope scale is set by the four scores shown.",children:l.jsx(n2,{label:"AUC without and with local climate averages",startLabel:"Without climate",endLabel:"With climate",highlightKey:"late_or_ld-logit",formatValue:EL,formatChange:t=>`${t>=0?"+":""}${t.toFixed(3)}`,data:SL})}),l.jsx("p",{children:"The late-finish change of 0.002 sits inside the margin of error, with a 95% interval of -0.001 to 0.004. Weather that actually happened lifts the score further, to 0.785 in the simple model and 0.802 in the boosted model. Nobody knows that weather at bid time, so it explains outcomes without helping to predict them."}),l.jsx("p",{children:"Change orders behave differently. Climate averages gave the simple model a small but measurable lift for predicting a change order that added contract days, from 0.675 to 0.684, and almost none for the boosted model. Weather that actually happened lifted the boosted model from 0.742 to 0.800, which points to weather driving added days once it arrives, even though climate averages do not foretell it."}),l.jsx(As,{children:l.jsx("p",{children:"Do not buy a weather-aware tool to forecast finish dates from climate averages. Use climate data to set realistic allowed days and float at the start, and use live weather records to explain delays and support time claims after the fact."})})]}),l.jsxs(wa,{id:"documents",title:"How accurately can AI sort contract documents?",children:[l.jsxs("p",{children:["Sorting documents into types is a basic task for AI in contract administration. We trained a simple text classifier on the first 4,000 characters of each document. It covers 24 classes, made up of the 23 document types with at least 20 examples and a catch-all class for documents outside contract administration. It trained on ",mr.train," documents and was tested on ",mr.test,", with documents from the same council, contract or court case kept on the same side of the split. Large classes were capped at 400 test documents, so the accuracy figure describes this capped test set and not the full public collection."]}),l.jsxs("p",{children:["Overall accuracy was 94.1%. The balanced score, called macro-F1, was only 0.74. Macro-F1 averages the per-type F1 score, so every type counts equally whether it has 400 test documents or one. F1 itself balances precision and recall. Accuracy on its own can mislead when some classes are far larger than others, as Google's machine learning course points out (",l.jsx(Xn,{href:"https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall",children:"Google, Machine Learning Crash Course, Classification: Accuracy, recall, precision"}),")."]}),l.jsx(nn,{n:10,title:"Classifier results by document type",takeaway:"Common, templated documents score near 1.0. Look-alike payment and variation documents score between 0.24 and 0.40.",source:"Mastt analysis of public contract documents from US and Australian public sources, 3,393 test documents, 24 classes.",note:"Types with fewer than 20 test documents give unstable scores. Select a column heading to sort.",children:l.jsxs(A2,{defaultValue:"best",children:[l.jsxs(E2,{children:[l.jsx(Do,{value:"best",children:"Best (20+ test documents)"}),l.jsx(Do,{value:"worst",children:"Weakest"}),l.jsx(Do,{value:"all",children:"All 24 types"})]}),l.jsx(Oo,{value:"best",children:l.jsx(ci,{rowKey:"type",caption:"Best-scoring document types",columns:id,rows:CL,defaultSort:{key:"f1",direction:"desc"}})}),l.jsx(Oo,{value:"worst",children:l.jsx(ci,{rowKey:"type",caption:"Weakest document types",columns:id,rows:RL,defaultSort:{key:"f1",direction:"asc"}})}),l.jsx(Oo,{value:"all",children:l.jsx(ci,{rowKey:"type",caption:"All 24 classes",columns:id,rows:mr.rows,defaultSort:{key:"f1",direction:"desc"}})})]})}),l.jsx("p",{children:"Final certificates (F1 0.95, 400 test documents), extension of time registers (0.98) and liquidated damages certificates (0.97) score highly, probably because they are formulaic. The look-alikes score poorly. The model found only 15% of final payment claims (F1 0.24), and progress claims scored 0.40 and change proposals 0.33. These types likely share wording and layout with their neighbours, and a wrong filing matters because they carry payment and variation rights."}),l.jsx("p",{children:"Two cautions apply. The labels came from rules that filed each document by its name and opening page, not from human review, so some of the errors may be label noise. The split was grouped by contract, but some Texas projects still appear on both sides of it, which probably flatters the 94%. The result is best read as an upper estimate for a simple method, to be re-tested with a stricter split and a hand-checked set before anyone relies on it."}),l.jsx(As,{children:l.jsx("p",{children:"AI can sort the common documents now, which saves filing time. Keep a person on the look-alikes, such as progress claims, final claims and change proposals, and ask any vendor for per-type scores rather than a single accuracy figure."})})]}),l.jsxs(wa,{id:"gap",title:"Why can't public data show everyday project paperwork?",children:[l.jsxs("p",{children:["RFIs, submittals, site instructions and defect notices are the daily work of contract administration, and they almost never become public. The public document set behind this research holds 103,102 documents from Australian and US public sources. Only 19 are RFIs. An industry body reporting a Navigant Construction Forum study of 1,362 projects says those projects averaged about 800 RFIs each (",l.jsx(Xn,{href:"https://ascconline.org/Home/News/articleType/ArticleView/articleId/121/Request-for-Information-RFI-and-Rework",children:"American Society of Concrete Contractors, Request for Information (RFI) and Rework, 2020"}),"). The average project in that study produced far more RFIs than the whole public set holds."]}),l.jsx(nn,{n:11,title:"Public contract documents by type",takeaway:"Tender and bid records, final completion records and variations make up about 73% of the set. Day-to-day site records are 50 documents, or 0.05%.",source:"Mastt analysis of public contract documents from US and Australian public sources, 103,102 documents collected in 2026.",note:"Tile size is the number of documents. Select a group to zoom in.",children:l.jsx(_D,{label:"Public contract documents by workflow group and type",height:420,formatValue:t=>t.toLocaleString("en-US"),data:jL})}),l.jsx("p",{children:"The set is also lopsided in source. Texas DOT accounts for 74,473 of the 103,102 documents, or 72%, so a model trained on this data learns the paperwork habits of one state transport agency. Owners publish outcomes such as awards, payments and completion certificates, while the working records behind those outcomes stay inside the project. That is the likely reason the everyday records are missing."}),l.jsxs(Yf,{children:[l.jsx(nn,{n:12,title:"Document types by number of public examples",takeaway:"Of 63 types in Mastt's contract administration taxonomy, 40 have fewer than 20 public examples, and 10 of those have none.",source:"Mastt analysis of public contract documents from US and Australian public sources, 63 document types.",wide:!1,children:l.jsx(wR,{label:"Document types by number of public examples",data:TL})}),l.jsx(nn,{n:13,title:"Everyday record types and how many are public",takeaway:"Six everyday record types have no public examples at all.",source:"Mastt analysis of public contract documents from US and Australian public sources.",wide:!1,children:l.jsx(ci,{rowKey:"type",caption:"Public documents by everyday record type",columns:[{key:"type",label:"Record type"},{key:"docs",label:"Public documents",numeric:!0}],rows:ML,defaultSort:{key:"docs",direction:"desc"}})})]}),l.jsx("p",{children:"Ten document types have no public examples, including RFI registers, submittal registers, defect registers and risk registers. Another 30 types have between one and 19. The registers that a contract administrator updates every week exist only inside projects."}),l.jsx(As,{children:l.jsx("p",{children:"AI tools that read RFIs, submittals and defect notices need a project's own data. Check that a tool is built on your records, not only on public ones, and keep those records structured, with consistent types, dates, owners and responses, so that a model has something to learn from."})})]}),l.jsxs(wa,{id:"rules",title:"Which simple rules already work without AI?",children:[l.jsx("p",{children:"Two plain checks held up in this research, and both use data a project team already has."}),l.jsxs(Ol,{title:"The halfway progress check",children:[l.jsx("p",{children:"Halfway through a job, compare the percentage of time used with the percentage of the contract value earned. We took the January 2017 monthly progress report for Texas DOT state construction jobs and kept the 436 jobs that were 20% to 80% through their time and could be matched to final records. Jobs whose earnings were level with or ahead of their time used paid late penalties 10% of the time. Jobs more than 10 points behind paid 47% of the time, and the median among those that paid was 46 days. Jobs more than 20 points behind paid 55% of the time."}),l.jsx(nn,{n:14,title:"Late penalties by progress gap at the halfway stage",takeaway:"The further behind a job is at the halfway stage, the more likely it ends with late penalties.",source:"Mastt analysis of public contract records, Texas DOT, 436 state construction jobs 20% to 80% through their time, January 2017 snapshot.",note:"Gap is the percentage of time used minus the percentage of work complete. One snapshot date so far, so the pattern needs repeating on later snapshots.",children:l.jsx("div",{style:{display:"grid",gap:"18px"},children:Fa.bands.map(t=>l.jsx(nO,{value:t.rate,label:`${t.label} (${t.n} jobs)`,showValue:!0},t.label))})}),l.jsx(ky,{items:[{label:"Penalty rate, jobs ahead or level",value:Math.round(Fa.ahead.rate),suffix:"%",context:`${Fa.ahead.n} jobs`},{label:"Penalty rate, jobs 10+ points behind",value:Math.round(Fa.gt10.rate),suffix:"%",context:`${Fa.gt10.n} jobs, median ${Fa.gt10.days} days of penalties`},{label:"Penalty rate, jobs 20+ points behind",value:Math.round(Fa.gt20.rate),suffix:"%",context:`${Fa.gt20.n} jobs`}]})]}),l.jsxs(Ol,{title:"Contractor track record",children:[l.jsx("p",{children:"The second rule asks how many jobs a firm has already done for the owner. We took 10,012 completed Texas DOT construction contracts, mostly awarded from 2009 to 2025. Firms with no award from the owner before 2012 count as new, and a cross-check against bid records suggests that label is right for about 94% of them. Their first jobs paid late penalties on 26% of 444 jobs, against 20% of 5,550 jobs for firms already working for the owner. On their second to fifth jobs the new firms were at 27%, and on jobs 6 to 20 they were at 26%. The rate fell to 21% from the twenty-first job, but firms that reach that point are the survivors. The pattern suggests the gap is about the firm and not only the first job."}),l.jsx(nn,{n:15,title:"Late-penalty rate, first jobs of new firms against established firms",takeaway:"New firms' first jobs paid late penalties more often in every size band.",source:"Mastt analysis of public contract records, Texas DOT, completed construction contracts awarded 2012 to 2026 (444 first jobs of new firms, 5,550 jobs of established firms).",note:"Only 59 first jobs fall in the over $5 million band, so that comparison is the least certain.",children:l.jsx(n2,{label:"Share of jobs charged late penalties",startLabel:"Established firms",endLabel:"New firm, first job",highlightKey:"all",formatValue:bn,data:AL})}),l.jsx("p",{children:"An earlier model had put the first-job rate near 43%. A direct count of completed jobs found 26%. A simple count on good records is the first check any AI claim should face."})]}),l.jsx(As,{children:l.jsx("p",{children:"At the halfway mark, compare time used with money earned and review any job more than 10 points behind. When you assess bidders, ask for track record with other owners and treat a new firm as a modest extra risk rather than a reason to exclude it."})})]}),l.jsxs(wa,{id:"summary",title:"What public data can and cannot do for AI",children:[l.jsx("p",{children:"Public records are good for setting the bar. They showed that item price history alone does not beat the engineer, that a late-finish ranking works modestly and holds up on later years, that climate averages do not help at bid time, and that common documents are easy to sort while look-alikes are not. They are poor at the work that fills a project manager's week."}),l.jsx(iE,{children:"The ceiling in this research belongs to public data, which is thin and skewed toward one owner. It does not describe what AI can do on a project's own records."}),l.jsx("p",{children:"Any AI claim can be tested the way these were. What was it tested on, did the test use later years, how does it compare with a simple rule, and what data does it need? For RFIs, submittals, variations and risk, the answer to the last question is a project's own records."})]}),l.jsx(oE,{items:[{question:"How accurate is a simple price model for Texas DOT lettings?",answer:"A price-history model missed the winning bid by a median 16.7% on 1,585 construction lettings in 2023-24, against 12.8% for the engineer's estimate. It was closer on 38% of lettings, and a 50/50 blend roughly matched the engineer."},{question:"Can AI predict which construction projects will finish late?",answer:"A simple model trained on earlier Texas DOT contracts ranked a late job above an on-time job 79% of the time on contracts awarded from 2022. Its riskiest fifth ran late 23% of the time, against 4.5% for the rest, so it ranks risk without being a verdict on any one job."},{question:"What does an AUC of 0.79 mean?",answer:"It means a randomly chosen late job gets a higher risk score than a randomly chosen on-time job 79% of the time. A coin flip scores 0.5 and a perfect model scores 1.0."},{question:"Does weather data improve late-finish prediction?",answer:"Adding local climate averages moved the score from 0.780 to 0.782, which is inside the margin of error. Weather that actually happened lifts it more, to 0.785 or 0.802, but it is not known at bid time."},{question:"How accurate is AI at sorting contract documents?",answer:"A simple classifier reached 94% accuracy across 24 document types, but its balanced score was only 0.74. Final payment claims scored 0.24, change proposals 0.33 and progress claims 0.40."},{question:"Why is there so little public data on RFIs and submittals?",answer:"Only 19 of 103,102 public contract documents are RFIs, and 72% of the documents come from one owner. Owners publish awards, payments and completion records, while the working records stay inside projects."},{question:"Which simple rule can warn of a late finish without AI?",answer:"At the halfway mark, compare time used with money earned. Texas DOT jobs more than 10 points behind paid late penalties on 47% of jobs, against 10% for jobs ahead."}]}),l.jsx(rE,{items:[{title:"State of AI in Construction Project Management 2026",publisher:"Mastt",url:sd,date:"July 2026"},{title:"5.4.1 Estimated Bid Price Determination, PS&E Preparation Manual",publisher:"Texas Department of Transportation",url:"https://www.txdot.gov/manuals/des/pse/chapter-5--engineer-s-estimate/section-4--prices/estimated-bid-price-determination.html"},{title:"Failure to Complete Work on Time, Construction Contract Administration Manual",publisher:"Texas Department of Transportation",url:"https://www.txdot.gov/manuals/cst/cah/prosecution_and_progress/progress_schedules-bcejejfc/failure_to_complete_work_on_time-i1019822.html"},{title:"Conceptual estimation of construction duration and cost of public highway projects",publisher:"Mohamed and Moselhi, Journal of Information Technology in Construction",url:"https://itcon.org/paper/2022/29",date:"2022"},{title:"Classification: ROC and AUC, Machine Learning Crash Course",publisher:"Google for Developers",url:"https://developers.google.com/machine-learning/crash-course/classification/roc-and-auc"},{title:"Classification: Accuracy, recall, precision, and related metrics, Machine Learning Crash Course",publisher:"Google for Developers",url:"https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall"},{title:"Leakage and the Reproducibility Crisis in ML-based Science",publisher:"Kapoor and Narayanan, Princeton University",url:"https://arxiv.org/abs/2207.07048"},{title:"Probability calibration",publisher:"scikit-learn documentation",url:"https://scikit-learn.org/stable/modules/calibration.html"},{title:"WMO Climatological Normals",publisher:"World Meteorological Organization",url:"https://community.wmo.int/node/36682"},{title:"Request for Information (RFI) and Rework",publisher:"American Society of Concrete Contractors",url:"https://ascconline.org/Home/News/articleType/ArticleView/articleId/121/Request-for-Information-RFI-and-Rework",date:"2020"}],methodology:l.jsxs(l.Fragment,{children:[l.jsx("p",{children:"Mastt's own findings come from analysis of public contract records. The price, late-finish, climate, halfway and track record tests use completed and in-progress Texas DOT construction and maintenance contracts, bid results and monthly progress reports. The price test covers 2,770 lettings held in 2023 and 2024, priced from winning bids in the previous 12 months. The late-finish model trained on 7,160 completed contracts awarded up to 2021 and was tested on 4,066 awarded from 2022. The climate test trained on 16,353 contracts awarded 2009 to 2020 and tested on 8,717 awarded 2021 to 2024, with 30-year climate averages and rain gauge records."}),l.jsx("p",{children:"The document tests use 103,102 public contract documents from United States and Australian public sources, collected in 2026 and filed into 63 document types by rules applied to titles and opening pages. Those labels are not human annotation, so some errors between look-alike types may come from the labels. The classifier used the fir
